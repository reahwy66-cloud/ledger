<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131916"><title>التاسكات اليومية — رِواء ستوديو</title><link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#131916;--p:#1b2320;--p2:#232c28;--line:#2f3a34;--txt:#f5f2ea;--mut:#8b9690;--brand:#9da79f;--ok:#7fbf9c;--bad:#de8a6e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:"IBM Plex Sans Arabic",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;border-radius:12px}.brand h1{font-size:19px;margin:0}.brand small{color:var(--mut)}a{color:inherit;text-decoration:none}.btn{border:1px solid var(--line);background:var(--p2);color:var(--txt);padding:10px 13px;border-radius:10px;font:inherit;cursor:pointer}.btn.primary{background:var(--brand);color:#131916;font-weight:700}.btn.ok{color:var(--ok)}.btn.bad{color:var(--bad)}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:13px}.form{display:grid;grid-template-columns:1fr 180px 180px auto;gap:8px}.form input,.form select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}.task{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.task h3{margin:0 0 4px;font-size:16px}.meta{font-size:12px;color:var(--mut)}.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.empty{text-align:center;color:var(--mut);padding:28px}.section-title{font-size:13px;color:var(--mut);margin:22px 4px 10px}.status{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px}.status.done{color:var(--ok)}.status.cancelled{color:var(--bad)}#msg{min-height:24px;color:var(--bad);font-size:12px}@media(max-width:720px){.form{grid-template-columns:1fr}.task{grid-template-columns:1fr}.acts{justify-content:flex-start}.top{align-items:flex-start}.top .btn{padding:8px 10px}}
</style></head><body><main class="wrap">
<div class="top"><div class="brand"><img src="riwa-logo.png"><div><h1>التاسكات اليومية</h1><small id="who">رِواء ستوديو</small></div></div><a class="btn" id="back" href="index.html">رجوع</a></div>
<section class="card" id="createBox" style="display:none"><form id="createForm" class="form"><select id="employee"><option value="">إلي أنا</option></select><input id="title" placeholder="اسم المهمة" required><select id="priority"><option value="normal">عادي</option><option value="important">مهم</option><option value="urgent">مهم جداً</option></select><input id="start" type="datetime-local" required><button class="btn primary">أوك</button></form><div id="msg"></div></section>
<div id="list"></div></main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const API="https://studio-ledger-mcp.reahwy66.workers.dev";
const SUPA_URL="https://gvnpixjkcmbrdfefbamr.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2bnBpeGprY21icmRmZWZiYW1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MDAyNDAsImV4cCI6MjEwMDQ3NjI0MH0.PPuHBLPRwFPvjMgoIWHCubDTX9at5gSgn4QKxcgsbQI";
const portal=new URLSearchParams(location.search).get("portal")==="staff";
const sb=createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let token="",actor="",employeeMap={};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=x=>new Intl.DateTimeFormat("ar",{dateStyle:"medium",timeStyle:"short"}).format(new Date(x));
async function auth(){
 if(portal){token=localStorage.getItem("riwa_portal_staff_token")||"";document.querySelector("#back").href="staff-portal.html";document.querySelector("#who").textContent="بوابة الفريق";}
 else{token=(await sb.auth.getSession()).data.session?.access_token||"";}
 if(!token){location.href=portal?"staff-portal.html":"index.html";return false} return true;
}
async function call(method,body){
 const r=await fetch(API+"/daily-tasks",{method,headers:{"authorization":"Bearer "+token,...(body?{"content-type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"تعذّر تنفيذ الطلب");return d;
}
async function loadEmployees(){
 if(portal)return;
 const r=await sb.from("employees").select("id,data"); if(r.error)return;
 employeeMap={};r.data.filter(x=>x.data?.active!==false).forEach(x=>employeeMap[x.id]=x.data?.name||"موظف");document.querySelector("#employee").innerHTML='<option value="">إلي أنا</option>'+Object.keys(employeeMap).map(id=>'<option value="'+esc(id)+'">'+esc(employeeMap[id])+'</option>').join("");
}
function card(t){
 const open=t.status==="pending";
 const pr=t.priority==="urgent"?"مهم جداً":t.priority==="important"?"مهم":"عادي";
 const who=t.assignedEmployeeId?(employeeMap[t.assignedEmployeeId]||"الفريق"):"إلي أنا";
 return '<div class="card task"><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>'+esc(t.title)+'</h3><span class="status '+esc(t.status)+'">'+(t.status==="done"?"تم":t.status==="cancelled"?"ملغي":"مفتوحة")+'</span><span class="status">'+esc(pr)+'</span></div><div class="meta">'+esc(who)+' · '+fmt(t.startAt)+(open?' · فولو أب تلقائي كل ساعة':'')+'</div>'+(t.note?'<div class="meta" style="margin-top:4px">'+esc(t.note)+'</div>':'')+'</div>'+(open?'<div class="acts">'+(actor==="owner"?'<button class="btn primary" data-a="followup" data-id="'+t.id+'">فولو أب</button>':'')+'<button class="btn ok" data-a="done" data-id="'+t.id+'">تم</button><button class="btn bad" data-a="cancel" data-id="'+t.id+'">إلغاء</button><button class="btn" data-a="tomorrow" data-id="'+t.id+'">لبكرا</button><button class="btn" data-a="reschedule" data-id="'+t.id+'">تأجيل</button></div>':'')+'</div>';
}
async function load(){
 const d=await call("GET");actor=d.actor;document.querySelector("#createBox").style.display=actor==="owner"?"":"none";
 const items=d.items||[],open=items.filter(x=>x.status==="pending").sort((a,b)=>new Date(a.startAt)-new Date(b.startAt)),closed=items.filter(x=>x.status!=="pending").slice(0,30);
 document.querySelector("#list").innerHTML='<div class="section-title">المهام المفتوحة</div>'+(open.length?open.map(card).join(""):'<div class="card empty">ما في مهام مفتوحة.</div>')+(closed.length?'<div class="section-title">آخر المهام المنتهية</div>'+closed.map(card).join(""):'');
}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;b.disabled=true;try{let body={action:b.dataset.a,id:b.dataset.id};if(body.action==="reschedule"){const v=prompt("اكتب الوقت الجديد بهذا الشكل: 2026-09-22T19:00");if(!v){b.disabled=false;return}body.startAt=new Date(v).toISOString()}await call("POST",body);await load()}catch(err){alert(err.message)}finally{b.disabled=false}});
document.querySelector("#createForm").onsubmit=async e=>{e.preventDefault();const m=document.querySelector("#msg");m.textContent="";try{const start=document.querySelector("#start").value;if(!start)throw new Error("حدد وقت البداية");await call("POST",{action:"create",title:document.querySelector("#title").value,startAt:new Date(start).toISOString(),assignedEmployeeId:document.querySelector("#employee").value,priority:document.querySelector("#priority").value});e.target.reset();await load()}catch(err){m.textContent=err.message}};
if(await auth()){await loadEmployees();await load();setInterval(load,30000)}
</script></body></html>
