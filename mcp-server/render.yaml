services:
  - type: web
    name: studio-ledger-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_MCP_URL
        sync: false
      - key: NOTIFICATION_WEBHOOK_URL
        sync: false
      - key: NOTIFICATION_WEBHOOK_SECRET
        sync: false
