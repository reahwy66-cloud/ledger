<style>
:root{
  --ground:#131916;--panel:#1B2320;--panel-2:#232C28;--line:#2F3A34;
  --bone:#F5F2EA;--mute:#7E8A83;--brand:#9DA79F;
  --cyan:#8FB0B8;--green:#7FBF9C;--coral:#DE8A6E;
  --brand-w:rgba(157,167,159,.14);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --ar:"IBM Plex Sans Arabic","Noto Sans Arabic","Dubai",Tahoma,sans-serif;
  --sans:"IBM Plex Sans","Helvetica Neue",-apple-system,system-ui,"Segoe UI",sans-serif;
}
[data-theme="light"]{
  --ground:#F5F2EA;--panel:#FFFFFF;--panel-2:#EFEBE1;--line:#E1DCD0;
  --bone:#232C27;--mute:#78847C;--brand:#4A6B5A;
  --cyan:#4E7480;--green:#2E7A57;--coral:#B0563C;
  --brand-w:rgba(74,107,90,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--bone);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body[dir="rtl"]{font-family:var(--ar);line-height:1.75}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px}

/* ── masthead ── */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:24px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.stamp{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;overflow:hidden;
  background:var(--panel-2);border:1px solid var(--line);color:var(--brand);font-size:16px;font-weight:600}
.stamp img{width:100%;height:100%;object-fit:cover;display:block}
.stamp.logo{background:var(--bone);border-color:transparent}
[data-theme="light"] .stamp.logo{background:var(--panel);border-color:var(--line)}
.brand h1{font-size:19px;margin:0;letter-spacing:-.01em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:3px}
body[dir="rtl"] .brand small{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:11.5px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthpick{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 6px}
.monthpick button{background:none;border:0;color:var(--mute);font-size:16px;cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
.monthpick button:hover{background:var(--panel-2);color:var(--bone)}
.monthpick .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.04em;min-width:100px;text-align:center;cursor:pointer;border-radius:6px;padding:3px 0}
.monthpick .lbl:hover{background:var(--panel-2)}
.chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--bone);line-height:1.2}
.chip:hover{border-color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.owner{background:var(--brand)}.dot.manager{background:var(--cyan)}.dot.accountant{background:var(--green)}

/* ── tabs ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font-family:var(--mono);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
body[dir="rtl"] .tabs button{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:13px}
.tabs button:hover{color:var(--bone)}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* ── generic ── */
h2{font-size:15px;margin:0 0 3px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
body[dir="rtl"] .eyebrow{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12px}
.sec{margin-top:26px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.pos{color:var(--green)}.neg{color:var(--coral)}.acc{color:var(--brand)}.cy{color:var(--cyan)}.mut{color:var(--mute)}

/* ── buttons ── */
.btn{background:var(--panel-2);border:1px solid var(--line);color:var(--bone);font-family:var(--mono);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;padding:9px 14px;border-radius:9px;cursor:pointer}
body[dir="rtl"] .btn{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12.5px}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--ground);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:10px}
body[dir="rtl"] .btn.sm{font-size:11.5px}
.btn.danger{color:var(--coral)}
.btn.danger:hover{border-color:var(--coral)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ── KPI strip ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .v{font-family:var(--mono);font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  margin-top:6px;display:block;direction:ltr;unicode-bidi:isolate;line-height:1.1}
body[dir="rtl"] .kpi .v{text-align:right}
.kpi .n{font-size:11.5px;color:var(--mute);margin-top:5px;display:block}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--line)}
.kpi.in::after{background:var(--green)}.kpi.out::after{background:var(--coral)}
.kpi.net::after{background:var(--brand)}.kpi.you::after{background:var(--cyan)}

/* ── the cascade ── */
.ledger{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ledger-head{padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fall{padding:6px 18px 10px}
.step{display:grid;grid-template-columns:158px 1fr 112px;gap:12px;align-items:center;padding:7px 0}
.step .lab{font-size:12.5px;color:var(--mute)}
.step .lab b{color:var(--bone);font-weight:500;display:block;font-size:13px}
.step.total{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.track{height:26px;background:var(--ground);border-radius:4px;position:relative;overflow:hidden}
.bar{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:4px;width:0;transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar.keep{background:var(--brand);background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 72%,#000))}
.bar.cut{background:var(--coral);background:repeating-linear-gradient(45deg,var(--coral),var(--coral) 6px,color-mix(in srgb,var(--coral) 70%,#000) 6px,color-mix(in srgb,var(--coral) 70%,#000) 12px);opacity:.85}
.step .amt{text-align:end;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.step.total .amt{font-size:16px;font-weight:600}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 18px}
.slice{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--ground)}
.slice.mine{border-color:var(--brand)}
.slice .who{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
body[dir="rtl"] .slice .who{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12px}
.slice .big{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;display:block;margin:6px 0 2px;
  direction:ltr;unicode-bidi:isolate;line-height:1.1}
body[dir="rtl"] .slice .big{text-align:right}
.slice .note{font-size:11.5px;color:var(--mute)}
.carve{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;font-size:12px}
.carve b{color:var(--bone)}

/* ── tables ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
  font-weight:400;padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
body[dir="rtl"] th{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12px}
td{padding:11px 10px;border-bottom:1px solid var(--panel-2);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.sum td{border-top:1px solid var(--line);border-bottom:0;padding-top:12px}
td.r,th.r{text-align:end}
.lnk{color:var(--bone);text-decoration:none;border-bottom:1px dotted var(--mute);font-weight:600}
.lnk:hover{color:var(--brand);border-bottom-color:var(--brand)}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
body[dir="rtl"] .pill{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:11px}
.pill.on{color:var(--green);border-color:var(--line);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.pill.amb{color:var(--brand);border-color:var(--line);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.pill.cy{color:var(--cyan);border-color:var(--line);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.empty{text-align:center;padding:34px 14px;color:var(--mute);font-size:13px}

.note{background:var(--brand-w);border:1px solid var(--line);border-color:color-mix(in srgb,var(--brand) 30%,transparent);
  border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--bone);opacity:.92}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

/* ── modal ── */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.72);display:flex;align-items:flex-start;justify-content:center;
  padding:5vh 16px 40px;overflow:auto;z-index:60}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;padding:22px}
.modal h3{margin:0 0 16px;font-size:15px;font-weight:600}
.f{margin-bottom:13px}
.f label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
body[dir="rtl"] .f label{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12px}
.f .hint{font-size:11.5px;color:var(--mute);margin-top:5px}
input,select,textarea{width:100%;background:var(--ground);border:1px solid var(--line);color:var(--bone);
  border-radius:9px;padding:10px 11px;font-family:inherit;font-size:13.5px}
input[type=number],input[type=date],input[type=month],input[type=time],input[type=password]{font-family:var(--mono);direction:ltr;text-align:start}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:9px}
.chk input{width:auto;accent-color:var(--brand)}
.chk label{margin:0!important;font-family:inherit!important;text-transform:none!important;letter-spacing:0!important;
  font-size:13px!important;color:var(--bone)!important}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.sw button[aria-pressed="true"]{border-color:var(--bone);box-shadow:inset 0 0 0 2px var(--panel)}

/* ── calendar ── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-scroll{overflow-x:auto;padding-bottom:2px}
.cal .dow{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center;padding-bottom:6px}
body[dir="rtl"] .cal .dow{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:11.5px}
.day{background:var(--ground);border:1px solid var(--line);border-radius:9px;min-height:84px;padding:6px;cursor:pointer;position:relative}
.day:hover{border-color:var(--mute)}
.day.mute{opacity:.32;cursor:default}
.day.off{border-style:dashed}
.day.today{border-color:var(--brand)}
.day .dn{font-family:var(--mono);font-size:11px;color:var(--mute)}
.day .ev{background:var(--brand-w);border-inline-start:2px solid var(--brand);border-radius:3px;font-size:10.5px;
  padding:2px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .ev.done{border-inline-start-color:var(--green);opacity:.78}
.day .ev.cancelled{border-inline-start-color:var(--coral);opacity:.52;text-decoration:line-through}
.day .load{position:absolute;inset-inline-end:6px;top:6px;font-family:var(--mono);font-size:9px;color:var(--brand)}
.day .load.over{color:var(--coral)}

/* ── gate ── */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatebox{width:100%;max-width:440px}
.gatebox .head{text-align:center;margin-bottom:26px}
.gatebox .stamp{margin:0 auto 16px;width:64px;height:64px;border-radius:18px;font-size:25px}
.gatebox h1{font-size:22px;margin:0 0 4px;font-weight:600}
.roles{display:grid;gap:10px}
.rolebtn{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;cursor:pointer;text-align:start;width:100%;color:var(--bone);font-family:inherit;font-size:14px}
.rolebtn:hover{border-color:var(--brand)}
.rolebtn .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:8px}
.rolebtn .ic.owner{background:var(--brand-w);color:var(--brand)}
.rolebtn .ic.manager{background:var(--panel-2);background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan)}
.rolebtn .ic.accountant{background:var(--panel-2);background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.rolebtn b{font-weight:600}
.rolebtn small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px;font-weight:400;line-height:1.45}
.langsw{display:flex;gap:6px;justify-content:center;margin-top:22px}
.langsw button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:7px 16px;cursor:pointer;font-family:inherit;font-size:12.5px}
.langsw button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-w)}

.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-inline-start:32px;margin-bottom:12px;font-size:13px;line-height:1.6}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:1px;width:22px;height:22px;border-radius:7px;
  background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--brand)}
code{background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-family:var(--mono);
  font-size:11.5px;color:var(--cyan);direction:ltr;display:inline-block;word-break:break-all;line-height:1.7}

@media(max-width:820px){
  .two,.three,.fork{grid-template-columns:1fr}
  .step{grid-template-columns:1fr 96px;gap:6px 10px}
  .step .track{grid-column:1/-1;order:3;height:14px;margin-top:2px}
  .wrap{padding:0 13px 70px}
  .kpis{grid-template-columns:1fr 1fr}
  .day{min-height:64px}
  .cal{min-width:680px}
  .fall,.fork,.ledger-head{padding-inline:14px}
}
@media(max-width:420px){.kpis{grid-template-columns:1fr}.brand small{display:none}}
@media print{
  .tabs,.tools,.btn,.note{display:none!important}
  body{background:#fff;color:#000}
  .card,.ledger,.kpi{border-color:#ccc;break-inside:avoid}
  .wrap{max-width:none;padding:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

async function pull(){
  if(DIRTY||PUSHING) return;
  PULLED={};
  setSync("cl.pulling");

  /* Permission V3: non-finance users first try the server-side sanitized snapshot.
     If the migration is not installed yet, fall back to the legacy reader so the
     app keeps working until the database update is applied. */
  if(MODE==="cloud"&&!canSeeMoney()){
    try{
      var snap=await SB.rpc("staff_safe_snapshot");
      if(snap&&!snap.error&&snap.data){
        var d=typeof snap.data==="string"?JSON.parse(snap.data):snap.data;
        SAFE_API=true;
        ["customers","employees","work","payments","shoots"].forEach(function(k){
          S[k]=Array.isArray(d[k])?d[k]:[];
        });
        ["invoices","fundings","advances","payouts","costs","transfers","outside","projects","osadvances","debts"].forEach(function(k){S[k]=[];});
        if(d.settings){
          var localOnly={theme:S.settings.theme,accent:S.settings.accent,lang:S.settings.lang,logo:S.settings.logo};
          S.settings=Object.assign({},S.settings,d.settings,localOnly);
        }
        PULLED.shoots=true;
        clearCalc();
        setSync("cl.synced");
        return;
      }
    }catch(_safeErr){}
    SAFE_API=false;
  }else{
    SAFE_API=false;
  }

  for(var i=0;i<TBL.length;i++){
    var key=TBL[i][0];
    try{
      var r=await SB.from(key).select("id,data");
      if(!r||r.error||!Array.isArray(r.data)) continue;
      PULLED[key]=true;
      S[key]=r.data.map(function(row){return Object.assign({id:row.id},row.data);});
    }catch(e){}
  }
  var st=null;
  try{ st=await SB.from("settings").select("data").eq("id",1).maybeSingle(); }catch(e){}
  if(st&&!st.error&&st.data&&st.data.data&&Object.keys(st.data.data).length){
    var localOnly2={theme:S.settings.theme,accent:S.settings.accent,lang:S.settings.lang};
    S.settings=Object.assign({},S.settings,st.data.data,localOnly2);
    PULLED.settings=true;
  }
  if(applyBrandDefaults()) setTimeout(save,0);
  await loadPortalPending();
  setSync("cl.synced");
}
function queuePush(){
  if(MODE!=="cloud"||!SB) return;
  DIRTY=true;
  clearTimeout(PUSHT);
  setSync("cl.syncing");
  PUSHT=setTimeout(function(){push();},400);
}
async function push(){
  if(PUSHING){ PUSHAGAIN=true; return; }   // a push is already running; run once more after it
  PUSHING=true;
  DIRTY=false;                              // capture: edits after this point re-dirty the state
  var ok=true;
  /* each table is saved on its own — one failure must never stop the rest,
     and any real error is printed so it can be seen, not swallowed */
  for(var i=0;i<TBL.length;i++){
    var key=TBL[i][0], sec=TBL[i][1];
    if(SAFE_API&&!canSeeMoney()&&key!=="shoots") continue;
    if(!PULLED[key]||!can(sec)) continue;
    try{
      var rows=(S[key]||[]).map(function(o){
        var d=Object.assign({},o); delete d.id;
        return {id:o.id,data:d,updated_at:new Date().toISOString()};
      });
      if(rows.length){
        var up=await SB.from(key).upsert(rows);
        if(up&&up.error) throw up.error;
      }
      /* Deliberately no "delete what is missing locally" sync here. A partial
         browser load must never be able to wipe cloud rows. Individual deletes
         are sent explicitly from the confirmed Delete button below. */
    }catch(e){
      ok=false;
      try{ console.error("[sync] table \""+key+"\" failed:", (e&&e.message)||e); }catch(_){}
    }
  }
  if(can("setup")&&!(SAFE_API&&!canSeeMoney())){
    try{
      var out=Object.assign({},S.settings); delete out.theme; delete out.accent; delete out.lang;
      var st=await SB.from("settings").upsert({id:1,data:out,updated_at:new Date().toISOString()});
      if(st&&st.error) throw st.error;
    }catch(e){ ok=false; try{ console.error("[sync] settings failed:",(e&&e.message)||e); }catch(_){} }
  }
  PUSHING=false;
  if(!ok) DIRTY=true;                        // failed — keep the flag so we retry, don't lose edits
  setSync(ok?"cl.synced":"cl.err");
  if(PUSHAGAIN||DIRTY){ PUSHAGAIN=false; queuePush(); }
}

/* ═════════════ engine ═════════════ */
function inMonth(d,m){return (d||"").slice(0,7)===m;}
/* a retainer you joined mid-month only pays for the days you worked */
function outsideAmt(o,m){
  var full=+o.amount||0;
  if(o.mode!=="daily") return full;
  var base=+o.base||30;
  var d=(o.daysByMonth&&o.daysByMonth[m]!=null)?+o.daysByMonth[m]:base;
  if(base<=0) return full;
  return full*Math.max(0,d)/base;
}
function outsideDays(o,m){
  var base=+o.base||30;
  return (o.daysByMonth&&o.daysByMonth[m]!=null)?+o.daysByMonth[m]:base;
}
/* what each person delivered — an unassigned job belongs to the owner */
function workCounts(empId,m,isOwner){
  var w=S.work.filter(function(x){
    return inMonth(x.date,m)&&(x.editorId===empId||(isOwner&&!x.editorId));});
  var o={};
  ["video","post","design","shoot","voice","script","task"].forEach(function(k){
    o[k]=w.filter(function(x){return x.type===k;}).reduce(function(a,x){return a+(+x.qty||0);},0);});
  return o;
}
function daysInMonth(m){var p=m.split("-");return new Date(+p[0],+p[1],0).getDate();}
function monthlyPay(e,m){
  if(e.payType!=="monthly")return 0;
  var start=e.startDate||"", end=e.endDate||"";
  if(start&&start.slice(0,7)>m)return 0;
  if(end&&end.slice(0,7)<m)return 0;
  var pay=+e.rate||0;
  if(start&&start.slice(0,7)===m){
    var first=Math.max(1,+start.slice(8,10)||1), dim=daysInMonth(m);
    pay=pay*(dim-first+1)/dim;
  }
  if(end&&end.slice(0,7)===m){
    var last=Math.min(daysInMonth(m),+end.slice(8,10)||daysInMonth(m));
    var begin=start&&start.slice(0,7)===m?Math.max(1,+start.slice(8,10)||1):1;
    pay=(+e.rate||0)*Math.max(0,last-begin+1)/daysInMonth(m);
  }
  return Math.round(pay*100)/100;
}
function salaryShare(e,m){return Math.round(monthlyPay(e,m)*(+e.sharedPct||0))/100;}
function fundingFee(f){return f.feeMode==="percent"?(+f.budget||0)*(+f.feeValue||0)/100:(+f.feeValue||0);}
function fundingTotal(f){return (+f.budget||0)+fundingFee(f);}
function fundingPaid(f){return S.payments.filter(function(p){return p.kind==="funding"&&p.fundingId===f.id;})
  .reduce(function(a,p){return a+(+p.amount||0);},0);}
var _cc={};
function clearCalc(){_cc={};}
function calc(m){
  if(_cc[m]) return _cc[m];
  return _cc[m]=_calc(m);
}
function _calc(m){
  var cashBasis=(S.settings.basis||"cash")==="cash";
  var work=S.work.filter(function(w){return inMonth(w.date,m);});
  var clients=[],revenue=0,adSpend=0;
  S.customers.forEach(function(c){
    if(!c.active)return;
    var mine=work.filter(function(w){return w.customerId===c.id;});
    var vids=mine.filter(function(w){return w.type==="video";}).reduce(function(a,w){return a+(+w.qty||0);},0);
    var posts=mine.filter(function(w){return w.type==="post";}).reduce(function(a,w){return a+(+w.qty||0);},0);
    var amt=0,basis="";
    var designs=mine.filter(function(w){return w.type==="design";}).reduce(function(a,w){return a+(+w.qty||0);},0);
    var monthInvoices=(S.invoices||[]).filter(function(inv){return inv.customerId===c.id&&inv.period===m&&(inv.status==="sent"||inv.status==="paid");});
    var salaryCharges=S.employees.filter(function(e){return e.sharedCustomerId===c.id;})
      .reduce(function(a,e){return a+salaryShare(e,m);},0);
    var extras=mine.reduce(function(a,w){return a+(+w.charge||0);},0);
    var clientFunding=(S.fundings||[]).filter(function(f){return f.customerId===c.id&&inMonth(f.date,m)&&f.status!=="cancelled";});
    var fundingBilled=clientFunding.reduce(function(a,f){return a+fundingTotal(f);},0);
    var fundingCost=clientFunding.reduce(function(a,f){return a+(+f.spentAmount||0);},0);
    if(monthInvoices.length){
      amt=monthInvoices.reduce(function(total,inv){return total+(inv.items||[]).reduce(function(a,i){return a+(+i.amount||0);},0);},0);
      basis=monthInvoices.map(function(inv){return inv.number||t("inv.title");}).join(", ");
    }
    else if(c.billing==="package"){
      amt=(+c.monthlyFee||0)+designs*(+c.drate||0)+extras+salaryCharges+fundingBilled;
      adSpend+=+c.adSpend||0;
      basis=t("b.packageL")+(designs&&(+c.drate)?(" + "+designs+" × "+money(+c.drate||0)):"");
    }
    else if(c.billing==="per_design"){amt=designs*(+c.drate||+c.rate||0)+extras+salaryCharges+fundingBilled;basis=designs+" × "+money(+c.drate||+c.rate||0);}
    else{
      // per-video client: videos at the video rate, plus any designs at the design rate
      amt=vids*(+c.rate||0)+designs*(+c.drate||0)+extras+salaryCharges+fundingBilled;
      basis=vids+" × "+money(+c.rate||0)+(designs&&(+c.drate)?(" + "+designs+" × "+money(+c.drate||0)):"");
    }
    if(cashBasis){
      // only money that actually arrived counts, and never the ad funding
      amt=S.payments.filter(function(x){
            return x.customerId===c.id&&inMonth(x.date,m);})
          .reduce(function(a,x){return a+(+x.amount||0);},0);
    }
    adSpend+=fundingCost;
    revenue+=amt;clients.push({c:c,vids:vids,posts:posts,designs:designs,amt:amt,basis:basis});
  });
  var payroll=0,people=[];
  S.employees.forEach(function(e){
    if(!e.active||e.payType==="percent")return;
    var pay=0,basis="";
    if(e.payType==="monthly"){pay=monthlyPay(e,m);basis=t("p.monthly");}
    else{
      var mine=work.filter(function(w){return w.editorId===e.id&&(e.payType!=="per_video"||w.type==="video");});
      var q=mine.reduce(function(a,w){return a+(+w.qty||0);},0);
      var ov=mine.reduce(function(a,w){return a+((w.amount!==""&&w.amount!=null)?+w.amount:0);},0);
      var noOv=mine.filter(function(w){return w.amount===""||w.amount==null;}).reduce(function(a,w){return a+(+w.qty||0);},0);
      pay=noOv*(+e.rate||0)+ov; basis=q+" × "+money(+e.rate||0);
    }
    payroll+=pay;people.push({e:e,pay:pay,basis:basis});
  });
  var opex=0,costs=[],ownerPaid=0;
  S.costs.forEach(function(x){
    var hit=x.recurring?((x.date||"").slice(0,7)<=m):inMonth(x.date,m);
    if(!hit)return;
    costs.push(x);
    if(x.payer!=="client_direct")opex+=+x.amount||0;
    if(x.payer&&x.payer!=="box"&&x.payer!=="client_direct") ownerPaid+=+x.amount||0;
  });
  var rentTop=S.settings.rentMode==="expense"?(+S.settings.rentFlat||0):0;
  opex+=rentTop;
  var totalOut=payroll+adSpend+opex, net=revenue-totalOut;

  /* every active person paid on a percentage is a partner in the profit */
  var partners=[],pctSum=0;
  S.employees.forEach(function(e){
    if(!e.active||e.payType!=="percent")return;
    var pct=+e.rate||0; pctSum+=pct;
    partners.push({e:e,pct:pct,share:net>0?net*pct/100:0});
  });
  /* the rent comes out of one partner's share — whoever paid the lease */
  var biggest=partners.slice().sort(function(a,b){return b.pct-a.pct;})[0];
  var rentEmp=S.settings.rentFromEmpId||(biggest?biggest.e.id:"");
  if(!partners.filter(function(pn){return pn.e.id===rentEmp;}).length)
    rentEmp=biggest?biggest.e.id:"";
  var rentSet=0;
  partners.forEach(function(pn){
    pn.rent=0;
    if(S.settings.rentMode==="myshare"&&pn.e.id===rentEmp&&pn.share>0){
      pn.rent=pn.share*(+S.settings.rentSharePct||0)/100;
      rentSet=pn.rent;
    }
    pn.take=pn.share-pn.rent;
  });
  var mine=partners.filter(function(pn){return pn.e.id===rentEmp;})[0];
  var yours=mine?mine.share:0, take=mine?mine.take:0;
  var mp=mine?(100-mine.pct):(partners.length?partners[0].pct:0);
  var mgr=net-yours;
  var outside=S.outside.filter(function(o){return o.active;})
    .reduce(function(a,o){return a+(o.kind==="income"?outsideAmt(o,m):-outsideAmt(o,m));},0);
  var projIn=0;
  S.projects.forEach(function(p){p.entries.forEach(function(e){if(inMonth(e.date,m))projIn+=+e.yours||0;});});
  return{clients:clients,revenue:revenue,people:people,payroll:payroll,adSpend:adSpend,costs:costs,
    opex:opex,ownerPaid:ownerPaid,cashBasis:cashBasis,rentTop:rentTop,totalOut:totalOut,net:net,partners:partners,pctSum:pctSum,
    rentEmp:rentEmp,mgr:mgr,mp:mp,yours:yours,rentSet:rentSet,
    take:take,outside:outside,projIn:projIn,pocket:take+outside+projIn};
}
/* Full statement for one client, up to and including month `thru`.
   balance > 0 = they owe us.  balance < 0 = they are in credit. */
function stmt(c,thru){
  var lines=[],billed=0,paid=0;
  var explicit=(S.invoices||[]).filter(function(inv){return inv.customerId===c.id&&(inv.status==="sent"||inv.status==="paid")&&(inv.period||inv.date||"").slice(0,7)<=thru;});
  function invoicedMonth(m){return explicit.some(function(inv){return (inv.period||inv.date||"").slice(0,7)===m;});}
  var open=+c.openingDue||0, adv=+c.credit||0;
  if(open) {lines.push({date:(c.startMonth||thru)+"-01",desc:t("line.open"),charge:open,paid:0}); billed+=open;}
  if(adv)  {lines.push({date:(c.startMonth||thru)+"-01",desc:t("line.adv"),charge:0,paid:adv}); paid+=adv;}

  if(c.billing==="package"){
    var m=c.startMonth||thru, guard=0, stop=c.endMonth&&c.endMonth<thru?c.endMonth:thru;
    while(m<=stop && guard++<180){
      var fee=+c.monthlyFee||0;
      if(fee&&!invoicedMonth(m)){
        var ad=+c.adSpend||0;
        var desc=t("line.sub",{m:monthName(m)})+(ad?" · "+t("inv.ads")+" "+money(ad):"");
        lines.push({date:m+"-01",desc:desc,charge:fee,paid:0}); billed+=fee;
      }
      m=addMonth(m,1);
    }
  }
  var vRate=+c.rate||0, dRate=+c.drate||0;
  if(c.billing!=="package"){
    if(c.billing==="per_design") dRate=+c.drate||+c.rate||0;
    S.work.filter(function(w){return w.customerId===c.id&&(w.date||"").slice(0,7)<=thru&&!invoicedMonth((w.date||"").slice(0,7));})
      .forEach(function(w){
        var isV=w.type==="video", isD=w.type==="design";
        if(c.billing==="per_design"){ if(!isD) return; }
        else { if(!isV&&!isD) return; if(isD&&!dRate) return; }
        var rate=isV?vRate:dRate;
        var amt=(+w.qty||0)*rate;
        if(!amt&&!(isD&&c.billing==="per_design")) { if(!amt) return; }
        lines.push({date:w.date,desc:w.qty+" × "+t(isV?"d.video":"d.design")+(w.note?" — "+w.note:""),charge:amt,paid:0});
        billed+=amt;});
  }
  if(c.billing==="package"&&dRate){
    S.work.filter(function(w){return w.customerId===c.id&&w.type==="design"&&(w.date||"").slice(0,7)<=thru&&!invoicedMonth((w.date||"").slice(0,7));})
      .forEach(function(w){
        var amt=(+w.qty||0)*dRate;
        if(!amt)return;
        lines.push({date:w.date,desc:w.qty+" × "+t("d.design")+(w.note?" — "+w.note:""),charge:amt,paid:0});
        billed+=amt;
      });
  }
  explicit.forEach(function(inv){
    (inv.items||[]).forEach(function(item){
      var amt=+item.amount||0;if(!amt)return;
      lines.push({date:inv.date||((inv.period||thru)+"-01"),desc:(inv.number?inv.number+" · ":"")+(item.description||t("inv.extra")),charge:amt,paid:0,invoiceId:inv.id});
      billed+=amt;
    });
  });
  /* Services outside the normal package/rate: shoots, voice work, rush fees, etc. */
  S.work.filter(function(w){return w.customerId===c.id&&(+w.charge||0)>0&&(w.date||"").slice(0,7)<=thru&&!invoicedMonth((w.date||"").slice(0,7));})
    .forEach(function(w){
      var amt=+w.charge||0;
      lines.push({date:w.date,desc:t("d."+(w.type||"task"))+(w.note?" — "+w.note:""),charge:amt,paid:0});
      billed+=amt;
    });
  /* Ad funding is billed as media budget + fee; only the fee is company profit. */
  (S.fundings||[]).filter(function(f){return f.customerId===c.id&&f.status!=="cancelled"&&(f.date||"").slice(0,7)<=thru&&!invoicedMonth((f.date||"").slice(0,7));})
    .forEach(function(f){
      var amt=fundingTotal(f);
      lines.push({date:f.date,desc:t("line.funding")+" · "+(f.platform||"Meta")+" ("+money(+f.budget||0)+" + "+money(fundingFee(f))+")",charge:amt,paid:0,fid:f.id});
      billed+=amt;
    });
  /* A client's agreed share of an employee salary becomes a monthly account charge. */
  S.employees.filter(function(e){return e.sharedCustomerId===c.id&&(+e.sharedPct||0)>0;}).forEach(function(e){
    var m=(e.startDate||((c.startMonth||thru)+"-01")).slice(0,7), stop=e.endDate&&e.endDate.slice(0,7)<thru?e.endDate.slice(0,7):thru,guard=0;
    while(m<=stop&&guard++<120){
      if(!invoicedMonth(m)){
        var amt=salaryShare(e,m);
        if(amt){lines.push({date:(e.startDate&&e.startDate.slice(0,7)===m?e.startDate:m+"-01"),desc:t("line.salaryShare",{n:e.name}),charge:amt,paid:0});billed+=amt;}
      }
      m=addMonth(m,1);
    }
  });
  S.payments.filter(function(x){return x.customerId===c.id&&(x.date||"").slice(0,7)<=thru;})
    .forEach(function(x){
      lines.push({date:x.date,desc:t("line.pay")+(x.note?" — "+x.note:"")+(x.method?" ("+t("m."+x.method)+")":""),charge:0,paid:+x.amount||0,pid:x.id});
      paid+=+x.amount||0;});

  lines.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  var run=0; lines.forEach(function(l){run+=l.charge-l.paid; l.run=run;});
  return {lines:lines,billed:billed,paid:paid,balance:billed-paid};
}

/* what has actually been delivered */
function delivered(c,month){
  var w=S.work.filter(function(x){return x.customerId===c.id&&(month?inMonth(x.date,month):true);});
  var o={};
  ["video","post","design","shoot","voice","task"].forEach(function(k){
    o[k]=w.filter(function(x){return x.type===k;}).reduce(function(a,x){return a+(+x.qty||0);},0);});
  return o;
}
function deliveredChips(o){
  var out=["video","post","design","shoot","voice","task"].filter(function(k){return o[k]>0;})
    .map(function(k){return '<span class="pill">'+o[k]+' '+t("d."+k)+'</span>';});
  return out.length?out.join(" "):'<span class="mut">'+t("cd.none")+'</span>';
}
/* What one person earned in a given month (manager = his share of profit). */
function earnedIn(e,m){
  if(e.payType==="percent"){
    var pn=calc(m).partners.filter(function(x){return x.e.id===e.id;})[0];
    return pn?pn.take:0;   // their share, after any rent they carry
  }
  var hit=calc(m).people.filter(function(x){return x.e.id===e.id;})[0];
  return hit?hit.pay:0;
}
/* Month-by-month ledger: earned − advances, with unrecovered advances carried forward.
   Assumes you settle the net due at the end of each month. */
function empLedger(e,thru){
  var ds=[];
  S.advances.filter(function(a){return a.employeeId===e.id;}).forEach(function(a){ds.push((a.date||"").slice(0,7));});
  S.work.filter(function(w){return w.editorId===e.id;}).forEach(function(w){ds.push((w.date||"").slice(0,7));});
  ds.sort();
  var first=ds.length?ds[0]:thru;
  var floor=addMonth(thru,-23);
  if(first<floor) first=floor;
  if(first>thru) first=thru;
  var rows=[],carry=0,m=first,guard=0;
  while(m<=thru&&guard++<40){
    var earned=earnedIn(e,m);
    var adv=S.advances.filter(function(a){return a.employeeId===e.id&&inMonth(a.date,m);})
      .reduce(function(s2,a){return s2+(+a.amount||0);},0);
    /* money the partner put back in from his own pocket pays the draw down */
    adv-=S.transfers.filter(function(x){return x.empId===e.id&&inMonth(x.date,m);})
      .reduce(function(s2,x){return s2+(+x.amount||0);},0);
    var due=earned-adv-carry;
    var payout=due>0?due:0, out=due<0?-due:0;
    rows.push({month:m,earned:earned,adv:adv,carryIn:carry,payout:payout,carryOut:out});
    carry=out; m=addMonth(m,1);
  }
  var cur=rows[rows.length-1]||{month:thru,earned:0,adv:0,carryIn:0,payout:0,carryOut:0};
  return {rows:rows,cur:cur};
}
function totalDue(thru){
  var sum=0,cnt=0;
  S.customers.forEach(function(c){var b=stmt(c,thru).balance; if(b>0.005){sum+=b;cnt++;}});
  return {sum:sum,count:cnt};
}

/* ═════════════ INVOICES ═════════════ */
function invoiceTotal(inv){return (inv&&inv.items||[]).reduce(function(a,x){return a+(+x.amount||0);},0);}
function invoicePaid(inv){return S.payments.filter(function(p){return p.invoiceId===inv.id&&p.kind!=="funding";})
  .reduce(function(a,p){return a+(+p.amount||0);},0);}
function invoiceState(inv){
  if(inv.status==="cancelled")return "cancelled";
  if(inv.status==="paid")return "paid2";
  var total=invoiceTotal(inv), paid=invoicePaid(inv);
  if(total>0&&paid>=total-0.005)return "paid2";
  return inv.status||"draft";
}
function nextInvoiceNumber(){
  var y=new Date().getFullYear(), max=0;
  (S.invoices||[]).forEach(function(x){var m=String(x.number||"").match(new RegExp("^INV-"+y+"-(\\d+)$"));if(m)max=Math.max(max,+m[1]);});
  return "INV-"+y+"-"+String(max+1).padStart(3,"0");
}
function invoiceForm(inv,custId){
  var c=S.customers.filter(function(x){return x.id===(inv?inv.customerId:custId);})[0]||S.customers[0];
  var dm=c?delivered(c,MONTH):{video:0,design:0};
  var defaults=inv||{
    number:nextInvoiceNumber(),customerId:c?c.id:"",date:todayISO(),dueDate:(function(){var d=new Date();d.setDate(d.getDate()+14);return d.toISOString().slice(0,10);})(),
    period:MONTH,status:"draft",serviceAmount:c&&c.billing==="package"?Math.max(0,(+c.monthlyFee||0)-(+c.adSpend||0)):0,
    adAmount:c?(+c.adSpend||0):0,videoQty:c&&c.billing!=="package"?(+dm.video||0):0,videoRate:c?(+c.rate||0):0,
    designQty:c&&(+c.drate||0)?(+dm.design||0):0,designRate:c?(+c.drate||0):0,extraDesc:"",extraAmount:0,notes:""
  };
  form(inv?t("inv.edit"):t("inv.new"),[
    {k:"number",label:t("inv.number"),def:defaults.number},
    {k:"customerId",label:t("inv.customer"),type:"select",def:defaults.customerId,options:S.customers.map(function(x){return [x.id,x.name];})},
    {k:"date",label:t("inv.issue"),type:"date",def:defaults.date},
    {k:"dueDate",label:t("inv.dueDate"),type:"date",def:defaults.dueDate},
    {k:"period",label:t("inv.period2"),type:"month",def:defaults.period||MONTH},
    {k:"status",label:t("inv.mark"),type:"select",def:defaults.status||"draft",options:[["draft",t("inv.draft")],["sent",t("inv.sent")],["paid",t("inv.paid2")],["cancelled",t("inv.cancelled")]]},
    {k:"serviceAmount",label:t("inv.service"),type:"number",step:"0.01",def:defaults.serviceAmount||0},
    {k:"adAmount",label:t("inv.ads"),type:"number",step:"0.01",def:defaults.adAmount||0},
    {k:"videoQty",label:t("inv.videoQty"),type:"number",step:"1",def:defaults.videoQty||0},
    {k:"videoRate",label:t("inv.videoRate"),type:"number",step:"0.01",def:defaults.videoRate||0},
    {k:"designQty",label:t("inv.designQty"),type:"number",step:"1",def:defaults.designQty||0},
    {k:"designRate",label:t("inv.designRate"),type:"number",step:"0.01",def:defaults.designRate||0},
    {k:"extraDesc",label:t("inv.extra"),def:defaults.extraDesc||""},
    {k:"extraAmount",label:t("inv.extraAmount"),type:"number",step:"0.01",def:defaults.extraAmount||0},
    {k:"notes",label:t("inv.notes"),type:"textarea",def:defaults.notes||""}
  ],inv?defaults:null,function(v){
    if(v===null){S.invoices=S.invoices.filter(function(x){return x.id!==inv.id;});return;}
    var items=[];
    if(+v.serviceAmount)items.push({kind:"service",description:t("inv.service"),amount:+v.serviceAmount});
    if(+v.adAmount)items.push({kind:"ads",description:t("inv.ads"),amount:+v.adAmount});
    if((+v.videoQty||0)*(+v.videoRate||0))items.push({kind:"video",description:v.videoQty+" × "+t("d.video"),qty:+v.videoQty,rate:+v.videoRate,amount:+v.videoQty*+v.videoRate});
    if((+v.designQty||0)*(+v.designRate||0))items.push({kind:"design",description:v.designQty+" × "+t("d.design"),qty:+v.designQty,rate:+v.designRate,amount:+v.designQty*+v.designRate});
    if(+v.extraAmount)items.push({kind:"other",description:v.extraDesc||t("inv.extra"),amount:+v.extraAmount});
    v.items=items; v.updatedAt=new Date().toISOString();
    if(inv)Object.assign(inv,v);else{v.id=uid();v.createdAt=v.updatedAt;S.invoices.push(v);}
  });
}

/* ══════ the cash box ══════
   Every real movement of money, in date order, with what is left after each one.
   Accrued figures (profit, what a client owes) live elsewhere — this is only
   money that actually changed hands. */
function movements(upto){
  var out=[];
  /* deliveries — they shape the invoice, but no cash changes hands */
  S.work.forEach(function(x){
    var c=S.customers.filter(function(y){return y.id===x.customerId;})[0];
    var e=S.employees.filter(function(y){return y.id===x.editorId;})[0];
    out.push({date:x.date,kind:"work",who:c?c.name:"—",
      note:x.qty+" "+t("d."+(x.type||"video"))+(e?" · "+e.name:"")+(x.note?" · "+x.note:""),
      amt:0,dir:0,id:x.id,act:"editwork",sec:"work",customerId:x.customerId||"",employeeId:x.editorId||"",workType:x.type||"video",qty:+x.qty||0});
  });
  /* client money — a plain payment, or funding earmarked for the ad platforms */
  S.payments.forEach(function(x){
    var c=S.customers.filter(function(y){return y.id===x.customerId;})[0];
    out.push({date:x.date,kind:x.kind==="funding"?"fund":"pay",who:c?c.name:"—",note:x.note||"",
      amt:+x.amount||0,dir:1,id:x.id,act:"editpay",sec:"payments",customerId:x.customerId||""});
  });
  /* media spend attached to a funding campaign */
  (S.fundings||[]).forEach(function(x){
    var c=S.customers.filter(function(y){return y.id===x.customerId;})[0];
    var payer=x.payer||"box", pe=S.employees.filter(function(y){return y.id===payer;})[0];
    var tag=payer==="box"?"":(" · "+t("cost.owner",{n:pe?pe.name:"—"}));
    if((+x.spentAmount||0)>0)out.push({date:x.date,kind:"fundspend",who:c?c.name:(x.platform||"—"),note:(x.platform||"Meta")+tag,
      amt:+x.spentAmount||0,dir:payer==="box"?-1:0,id:x.id,act:"editfunding",sec:"funding",customerId:x.customerId||"",employeeId:(payer&&payer!=="box"&&payer!=="client_direct")?payer:""});
  });
  /* costs only leave the box when the box paid for them */
  S.costs.forEach(function(x){
    var payer=x.payer||"box";
    var pe=payer==="box"?null:S.employees.filter(function(y){return y.id===payer;})[0];
    var tag=payer==="box"?"":(payer==="client_direct"?" · "+t("cost.client"):" · "+t("cost.owner",{n:pe?pe.name:"—"}));
    var push=function(d){
      out.push({date:d,kind:"cost",who:t("c."+x.category),note:(x.note||"")+tag,
        amt:+x.amount||0,dir:payer==="box"?-1:0,id:x.id,act:"editcost",sec:"costs",customerId:x.customerId||"",employeeId:(payer&&payer!=="box"&&payer!=="client_direct")?payer:""});
    };
    if(x.recurring){
      var m=(x.date||"").slice(0,7),guard=0;
      while(m<=upto&&guard++<120){ push(m+"-"+(x.date||"").slice(8,10)); m=addMonth(m,1); }
    } else push(x.date);
  });
  S.advances.forEach(function(x){
    var e=S.employees.filter(function(y){return y.id===x.employeeId;})[0];
    var back=x.kind==="repay";
    out.push({date:x.date,kind:back?"repay":"adv",who:e?e.name:"—",note:x.note||"",
      amt:+x.amount||0,dir:back?1:-1,id:x.id,act:"editadv",sec:"advances",employeeId:x.employeeId||""});
  });
  S.payouts.forEach(function(x){
    var e=S.employees.filter(function(y){return y.id===x.employeeId;})[0];
    out.push({date:x.date,kind:x.kind==="reimb"?"reim":"out",who:e?e.name:"—",note:x.note||"",
      amt:+x.amount||0,dir:-1,id:x.id,act:"editpayout",sec:"advances",employeeId:x.employeeId||""});
  });
  S.transfers.forEach(function(x){
    var e=S.employees.filter(function(y){return y.id===x.empId;})[0];
    out.push({date:x.date,kind:"trans",who:e?e.name:"—",note:x.note||"",
      amt:+x.amount||0,dir:1,id:x.id,act:"edittransfer",sec:"outside",employeeId:x.empId||""});
  });
  out=out.filter(function(x){return (x.date||"").slice(0,7)<=upto;});
  out.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  var run=+S.settings.openingCash||0;
  out.forEach(function(x){ run+=x.dir*x.amt; x.run=run; });
  return out;
}
/* ad funding sits in the box but belongs to the platforms */
function funding(upto){
  var got=S.payments.filter(function(x){return x.kind==="funding"&&(x.date||"").slice(0,7)<=upto;})
    .reduce(function(a,x){return a+(+x.amount||0);},0);
  var spent=S.costs.filter(function(x){return x.category==="Ads"&&(x.date||"").slice(0,7)<=upto;})
    .reduce(function(a,x){return a+(+x.amount||0);},0)
    +(S.fundings||[]).filter(function(x){return (x.date||"").slice(0,7)<=upto;}).reduce(function(a,x){return a+(+x.spentAmount||0);},0);
  return {got:got,spent:spent,left:got-spent};
}
/* costs someone paid out of their own pocket, less what they have been given back */
/* everything the company still owes other people */
function commitments(upto,exceptId){
  var sum=0;
  S.employees.forEach(function(e){
    if(!e.active||e.id===exceptId) return;
    var lg=empLedger(e,upto);
    var owed=lg.rows.reduce(function(a,r){return a+r.payout;},0)-paidTo(e.id,upto);
    if(owed>0) sum+=owed;
  });
  S.employees.forEach(function(e){
    if(e.id===exceptId) return;
    var ob=owedBack(e.id,upto);
    if(ob.due>0) sum+=ob.due;
  });
  return sum;
}
/* cash that is genuinely free to take out */
function available(upto,exceptId){
  var box=cashBox(upto).balance;
  var fu=Math.max(0,funding(upto).left);
  var com=commitments(upto,exceptId);
  return {box:box,funding:fu,committed:com,free:box-fu-com};
}
function owedBack(empId,upto){
  var paid=S.costs.filter(function(x){
      return x.payer===empId&&x.payer!=="client_direct"&&((x.date||"").slice(0,7)<=upto);})
    .reduce(function(a,x){return a+(+x.amount||0);},0)
    +(S.fundings||[]).filter(function(x){return x.payer===empId&&((x.date||"").slice(0,7)<=upto);})
      .reduce(function(a,x){return a+(+x.spentAmount||0);},0);
  var back=S.payouts.filter(function(x){
      return x.employeeId===empId&&x.kind==="reimb"&&(x.date||"").slice(0,7)<=upto;})
    .reduce(function(a,x){return a+(+x.amount||0);},0);
  return {paid:paid,back:back,due:paid-back};
}
/* the box before any wage left it, and after every wage still owed is paid.
   Partners are left out: their money is the split itself, not a wage. */
/* every component of the balance, so the figure can be checked by hand */
function boxParts(m){
  var mv=movements(m);
  var sum=function(fn){return mv.filter(fn).reduce(function(a,x){return a+x.amt;},0);};
  return {
    open:+S.settings.openingCash||0,
    inn:sum(function(x){return x.kind==="pay"||x.kind==="fund";}),
    cost:sum(function(x){return (x.kind==="cost"||x.kind==="fundspend")&&x.dir<0;}),
    adv:sum(function(x){return x.kind==="adv";}),
    wage:sum(function(x){return x.kind==="out";}),
    reim:sum(function(x){return x.kind==="reim";}),
    trf:sum(function(x){return x.kind==="trans";})
  };
}
function boxAroundWages(m){
  var box=cashBox(m).balance, paid=0, owed=0;
  S.employees.forEach(function(e){
    if(e.payType==="percent") return;
    paid+=paidTo(e.id,m);
    if(!e.active) return;
    var lg=empLedger(e,m);
    var due=lg.rows.reduce(function(a,r){return a+r.payout;},0)-paidTo(e.id,m);
    if(due>0) owed+=due;
  });
  return {before:box+paid, after:box-owed, paid:paid, owed:owed};
}
function cashBox(upto){
  var all=movements(upto);
  var inn=0,outp=0;
  all.forEach(function(x){ if(x.dir>0) inn+=x.amt; else if(x.dir<0) outp+=x.amt; });
  return {rows:all,inn:inn,out:outp,
          balance:(+S.settings.openingCash||0)+inn-outp,
          month:all.filter(function(x){return inMonth(x.date,upto);})};
}
/* what a person has actually been handed, versus what they were owed */
function paidTo(empId,upto){
  return S.payouts.filter(function(x){return x.employeeId===empId&&x.kind!=="reimb"&&(x.date||"").slice(0,7)<=upto;})
    .reduce(function(a,x){return a+(+x.amount||0);},0);
}

    h+='<button class="agenda-day'+(iso===selected?" active":"")+(iso===todayISO()?" today":"")+'" data-act="caldayselect" data-date="'+iso+'">'
      +'<small>'+esc(dow)+'</small><b>'+d+'</b>'+(count?'<i>'+count+'</i>':'')+'</button>';
  }
  h+='</div>'
    +'<section class="agenda-section"><div class="section-heading"><div><span class="eyebrow">'+selected+'</span><h2>'+(LANG==="ar"?"مواعيد اليوم":"Day agenda")+'</h2></div>'
    +(w?'<button class="btn sm primary" data-act="dayclick" data-date="'+selected+'">'+t("cal.add")+'</button>':'')+'</div>'
    +'<div class="agenda-list">';
  if(!selectedEvents.length) h+='<div class="agenda-empty">'+t("cal.none")+'</div>';
  selectedEvents.forEach(function(x){h+=agendaItem(x,w);});
  h+='</div></section>';
  if(monthEvents.length){
    h+='<section class="agenda-section secondary-agenda"><div class="section-heading"><div><h2>'+(LANG==="ar"?"باقي الشهر":"Later this month")+'</h2></div></div><div class="agenda-list">';
    monthEvents.slice(0,12).forEach(function(x){h+=agendaItem(x,w);});
    h+='</div></section>';
  }
  return h+'</div>';
}
function agendaItem(x,w){
  var c=S.customers.filter(function(y){return y.id===x.customerId;})[0];

  var title=x.title||(c&&c.name)||t("cal.k."+(x.kind||"meeting"));

    +'<div class="agenda-time"><b>'+esc(x.time||"—")+'</b><small>'+esc((x.date||"").slice(8,10))+'</small></div>'
    +'<div class="agenda-copy"><b>'+esc(title)+'</b><span>'+t("cal.k."+(x.kind||"meeting"))+(e?' · '+esc(e.name):'')+'</span>'
    +(x.notes?'<small>'+esc(x.notes)+'</small>':'')+'</div>'
    +'<span class="agenda-state">'+t("cal.st."+(x.status||"planned"))+'</span>'
    +'</'+(w?'button':'div')+'>';
}

     +'<td class="r"><span class="num pos">+'+money(x.amount)+'</span></td>'
     +'<td class="r"><button class="btn sm ghost" data-act="editosadv" data-id="'+x.id+'">'+t("edit")+'</button></td></tr>';
  });

  if(!S.debts.length) h+='<tr><td colspan="6" class="empty">'+t("dbt.none")+'</td></tr>';

  });
  h+='</tbody></table></div></div>';

  /* money moved from his own pocket into the business */
  h+='<div class="sec card"><div class="rowhead"><div><h2>'+t("trf.t")+'</h2>'

   +'<th>'+t("th.note")+'</th><th class="r">'+t("th.amt")+'</th><th></th></tr></thead><tbody>';
  var trTot=0;
  if(!S.transfers.length) h+='<tr><td colspan="5" class="empty">'+t("trf.none")+'</td></tr>';
  S.transfers.slice().sort(function(a,b){return a.date<b.date?1:-1;}).forEach(function(x){
    trTot+=+x.amount||0;
    var e=S.employees.filter(function(y){return y.id===x.empId;})[0];
    h+='<tr><td>'+n(esc(x.date))+'</td><td>'+esc(e?e.name:"—")+'</td>'
     +'<td class="mut">'+esc(x.note||"")+'</td>'
     +'<td class="r"><span class="num neg">−'+money(x.amount)+'</span></td>'
     +'<td class="r"><button class="btn sm ghost" data-act="edittransfer" data-id="'+x.id+'">'+t("edit")+'</button></td></tr>';
  });
  if(S.transfers.length) h+='<tr class="sum"><td colspan="3" class="r mut">'+t("cs.tot")+'</td>'
    +'<td class="r"><span class="num" style="font-weight:600">−'+money(trTot)+'</span></td><td></td></tr>';
  h+='</tbody></table></div></div>';

  S.projects.forEach(function(p){
    var got=p.entries.filter(function(e){return inMonth(e.date,MONTH);}).reduce(function(a,e){return a+(+e.yours||0);},0);
    h+='<div class="sec card"><div class="rowhead"><div><h2>'+esc(p.name)+'</h2>'
     +'<p class="sub" style="margin:0">'+esc(p.note)+'</p></div><span class="pill amb">'+t("st."+p.status)+'</span></div>'
     +'<div class="tbl-wrap"><table><thead><tr><th>'+t("th.who")+'</th><th class="r">'+t("th.share")+'</th>'
     +'<th class="r">'+t("th.on",{v:money(1000)})+'</th></tr></thead><tbody>'
     +p.splits.map(function(s){return '<tr><td>'+esc(s.who)+'</td><td class="r"><span class="num acc">'+s.pct+'%</span></td>'
       +'<td class="r"><span class="num mut">'+money(1000*s.pct/100)+'</span></td></tr>';}).join("")
     +'</tbody></table></div>'
     +'<div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">'
     +'<span class="mut" style="font-size:12.5px">'+t("os.got",{m:monthName(MONTH)})+' <b class="num cy">'+money(got)+'</b></span>'

     +'<button class="btn sm ghost" data-act="editproj" data-id="'+p.id+'">'+t("os.deal")+'</button></div></div></div>';
  });
  return h+'<div class="sec"><button class="btn ghost" data-act="newproj">'+t("os.newproj")+'</button></div>';
}

function vLedgerFull(){
  var box=cashBox(MONTH), fu=funding(MONTH);
  var r=calc(MONTH);
  var rows=box.rows.filter(function(x){return inMonth(x.date,MONTH);});
  if(LGTYPE!=="all"){
    if(LGTYPE==="money") rows=rows.filter(function(x){return x.kind!=="work";});
    else rows=rows.filter(function(x){
      if(LGTYPE==="wage") return x.kind==="out"||x.kind==="reim";
      if(LGTYPE==="fund") return x.kind==="fund"||x.kind==="fundspend";
      return x.kind===LGTYPE;});
  }
  if(LGWHO!=="all"){
    var cust=S.customers.filter(function(c){return c.id===LGWHO;})[0];
    var emp=S.employees.filter(function(e){return e.id===LGWHO;})[0];
    if(cust){
      rows=rows.filter(function(x){return x.who===cust.name;});
    } else if(emp){
      var isOwner=(emp.id===r.rentEmp);
      /* match rows that name the person, plus deliveries credited to them
         (an unassigned delivery belongs to the owner) */
      var workIds={};
      S.work.forEach(function(wk){
        if(wk.editorId===emp.id||(isOwner&&!wk.editorId)) workIds[wk.id]=1;
      });
      rows=rows.filter(function(x){
        if(x.kind==="work") return !!workIds[x.id];
        return x.who===emp.name;
      });
    }
  }
  var mIn=0,mOut=0;
  rows.forEach(function(x){ if(x.dir>0) mIn+=x.amt; else if(x.dir<0) mOut+=x.amt; });
  var rentEmp=S.employees.filter(function(e){return e.id===r.rentEmp;})[0];
  var ob=rentEmp?owedBack(rentEmp.id,MONTH):{due:0};

  var h='<div class="sec"><div class="kpis">'
   +kpi("net",t("box.t"),money(box.balance),t("box.n"))
   +kpi("in",t("box.in"),money(mIn),monthName(MONTH))
   +kpi("out",t("box.out"),money(mOut),monthName(MONTH))
   +(fu.left>0.005?kpi("you",t("fund.left"),money(fu.left),t("fund.n")):"")
   +(ob.due>0.005&&rentEmp?kpi("out",t("reim.t",{n:rentEmp.name}),money(ob.due),t("reim.n")):"")
   +'</div></div>';

  var wp=can("payments"), wa=can("advances"), wc=can("costs"), ww=can("work");
  h+='<div class="sec card ledger-shell"><div class="rowhead ledger-title"><div><h2>'+t("lg.t",{m:monthName(MONTH)})+'</h2>'
   +'<p class="sub" style="margin:0">'+t("lg.s")+'</p></div></div>'
   +'<div class="ledger-toolbar">'
   +'<select class="lgf" data-flt="type">'
     +[["all","flt.all"],["money","lg.money"],["pay","flt.pay"],["work","flt.work"],
       ["adv","flt.adv"],["wage","flt.wage"],["cost","flt.cost"],["fund","flt.fund"]]
       .map(function(o){return '<option value="'+o[0]+'"'+(LGTYPE===o[0]?" selected":"")+'>'+t(o[1])+'</option>';}).join("")
     +'</select>'
   +'<select class="lgf" data-flt="who">'
     +'<option value="all"'+(LGWHO==="all"?" selected":"")+'>'+t("flt.who")+': '+t("flt.all")+'</option>'
     +(S.customers.length?'<optgroup label="'+t("sec.clients")+'">'
        +S.customers.map(function(c){return '<option value="'+c.id+'"'+(LGWHO===c.id?" selected":"")+'>'+esc(c.name)+'</option>';}).join("")
        +'</optgroup>':'')
     +(S.employees.length?'<optgroup label="'+t("sec.team")+'">'
        +S.employees.map(function(e){return '<option value="'+e.id+'"'+(LGWHO===e.id?" selected":"")+'>'+esc(e.name)+'</option>';}).join("")
        +'</optgroup>':'')
     +'</select>'
   +((LGTYPE!=="all"||LGWHO!=="all")?'<button class="btn sm ghost ledger-clear" data-act="lgclear">'+t("flt.clear")+'</button>':'')
   +'</div>'
   +'<div class="ledger-quick-actions">'
   +ledgerQuickAction("print",t("print"),"print",false,"")
   +(ww?ledgerQuickAction("newwork",t("wk.add"),"work",true,""):"")
   +(wp?ledgerQuickAction("newpay",t("cd.pay"),"pay",true,""):"")
   +(wp?ledgerQuickAction("newfund",t("fund.add"),"fund",false,""):"")
   +(wc?ledgerQuickAction("newcost",t("cs.add"),"cost",false,""):"")
   +(wa?ledgerQuickAction("newadv",t("ad.take"),"advance",false,""):"")
   +(wa?ledgerQuickAction("newpayout",t("po.add"),"payout",false,""):"")
   +(wa&&ob.due>0.005?ledgerQuickAction("newreimb",t("reim.add"),"reimburse",true,' data-id="'+rentEmp.id+'"'):"")
   +'</div><div class="tbl-wrap"><table><thead><tr>'
   +'<th>'+t("th.date")+'</th><th>'+t("th.action")+'</th><th>'+t("th.who")+'</th>'
   +'<th class="r">'+t("box.in")+'</th><th class="r">'+t("box.out")+'</th>'
   +'<th class="r">'+t("lg.run")+'</th><th></th></tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="7" class="empty">'+t("lg.none")+'</td></tr>';
  rows.forEach(function(x){
    var lbl={pay:"lg.pay",cost:"lg.cost",fundspend:"fund.spent",adv:"lg.adv",out:"lg.out",work:"lg.work",fund:"lg.fund",reim:"lg.reim",trans:"lg.trans"}[x.kind]||"lg.pay";
    var pill={pay:"on",cost:"",fundspend:"",adv:"cy",out:"amb",work:"",fund:"cy",reim:"amb",trans:"on"}[x.kind]||"";
    var can_=can(x.sec);
    h+='<tr><td>'+n(esc(x.date))+'</td>'
     +'<td><span class="pill '+pill+'">'+t(lbl)+'</span></td>'
     +'<td>'+esc(x.who)+(x.note?'<div class="mut" style="font-size:11.5px">'+esc(x.note)+'</div>':'')+'</td>'
     +'<td class="r">'+(x.dir>0?'<span class="num pos">+'+money(x.amt)+'</span>':'')+'</td>'
     +'<td class="r">'+(x.dir<0?'<span class="num neg">−'+money(x.amt)+'</span>':(x.kind==="cost"?'<span class="mut" style="font-size:11.5px">'+money(x.amt)+'</span>':''))+'</td>'
     +'<td class="r">'+(x.dir!==0?'<span class="num '+(x.run<0?"neg":"")+'">'+money(x.run)+'</span>':'')+'</td>'
     +'<td class="r">'+(can_?'<button class="btn sm ghost" data-act="'+x.act+'" data-id="'+x.id+'">'+t("edit")+'</button>':'')+'</td></tr>';
  });
  h+='<tr class="sum"><td colspan="3" class="r mut">'+t("box.t")+'</td>'
   +'<td class="r"><span class="num pos">+'+money(mIn)+'</span></td>'
   +'<td class="r"><span class="num neg">−'+money(mOut)+'</span></td>'
   +'<td class="r"><span class="num" style="font-weight:600">'+money(box.balance)+'</span></td><td></td></tr>';
  h+='</tbody></table></div>';
  var bp=boxParts(MONTH);
  var line=function(lbl,v,sign){
    if(Math.abs(v)<0.005) return "";
    return '<div class="carve" style="border:0;padding:5px 0;margin:0">'
      +'<span>'+lbl+'</span><span class="num '+(sign>0?"pos":"neg")+'">'
      +(sign>0?"+":"−")+money(Math.abs(v))+'</span></div>';};
  h+='<div class="sec card"><span class="eyebrow">'+t("box.brk")+'</span><div style="margin-top:10px">'
   +line(t("box.open2"),bp.open,bp.open<0?-1:1)
   +line(t("box.in2"),bp.inn,1)
   +line(t("box.trf2"),bp.trf,1)
   +line(t("box.cost2"),bp.cost,-1)
   +line(t("box.adv2"),bp.adv,-1)
   +line(t("box.wage2"),bp.wage,-1)
   +line(t("box.reim2"),bp.reim,-1)
   +'<div class="carve" style="margin-top:8px"><span><b>'+t("box.eq")+'</b></span>'
   +'<span class="num" style="font-weight:600">'+money(box.balance)+'</span></div>'
   +'</div>';
  if(can("setup")) h+='<div style="margin-top:14px"><button class="btn sm ghost" data-act="editbox">'+t("box.set")+'</button></div>';
  h+='</div>';
  return h+'</div>';

/* ═════════════ forms ═════════════ */
function form(title,fields,vals,onSave,extra,saveLabel){
  var body=fields.map(function(f){
    var v=(vals&&vals[f.k]!=null)?vals[f.k]:(f.def!=null?f.def:"");
    var i;
    if(f.type==="select") i='<select name="'+f.k+'">'+f.options.map(function(o){
        return '<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?" selected":"")+'>'+esc(o[1])+'</option>';}).join("")+'</select>';
    else if(f.type==="textarea") i='<textarea name="'+f.k+'" rows="2">'+esc(v)+'</textarea>';
    else if(f.type==="check") i='<div class="chk"><input type="checkbox" name="'+f.k+'" id="k_'+f.k+'"'+(v?" checked":"")+'>'
        +'<label for="k_'+f.k+'">'+esc(f.checkLabel||"")+'</label></div>';
    else i='<input type="'+(f.type||"text")+'" name="'+f.k+'" value="'+esc(v)+'"'+(f.step?' step="'+f.step+'"':"")+'>';
    return '<div class="f" data-field="'+f.k+'"'+(f.showIf?" data-showif='"+JSON.stringify(f.showIf)+"'":"")+'>'
      +(f.type==="check"?"":'<label>'+esc(f.label)+'</label>')+i
      +(f.hint?'<div class="hint">'+esc(f.hint)+'</div>':"")+'</div>';
  }).join("");
  el("modalHost").innerHTML='<div class="scrim"><div class="modal" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3>'
   +'<div id="formBody">'+body+'</div>'+(extra||"")
   +'<div class="acts">'+((vals&&vals.id)?'<button class="btn danger ghost" id="fDel">'+t("del")+'</button>':"")
   +'<button class="btn ghost" id="fCancel">'+t("cancel")+'</button>'
   +'<button class="btn primary" id="fSave">'+(saveLabel||t("save"))+'</button></div></div></div>';
  function toggles(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-showif]"),function(d){
      var c=JSON.parse(d.getAttribute("data-showif"));
      var cur=el("formBody").querySelector('[name="'+c.k+'"]');
      d.style.display=(cur&&c.in.indexOf(cur.value)>=0)?"":"none";});
  }
  toggles();
  el("formBody").addEventListener("change",toggles);
  var scrim=document.querySelector(".scrim");
  scrim.addEventListener("mousedown",function(e){if(e.target===this)close();});
  el("fCancel").onclick=close;
  if(el("fDel")) el("fDel").onclick=function(){if(confirm(t("confirmDel"))){
    var cloudRow=cloudRowFor(vals.id);onSave(null);close();save();render();deleteCloudRow(cloudRow);
  }};
  el("fSave").onclick=function(){
    var out={};
    fields.forEach(function(f){var q=el("formBody").querySelector('[name="'+f.k+'"]');
      out[f.k]=f.type==="check"?q.checked:(f.type==="number"?(q.value===""?"":+q.value):q.value);});
    close(); onSave(out); save(); if(ROLE||ME) render();
  };
  function close(){el("modalHost").innerHTML="";applyTheme();}
}

  var cur=S.settings.accent||"#B2842E";
  var swHTML='<div class="f"><label>'+t("f.accent")+'</label><div class="sw">'

    +'</div><div class="hint">'+t("f.accentH")+'</div></div>';
  var logoHTML='<div class="f"><label>'+t("f.logo")+'</label>'
    +'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+stampHTML()
    +'<button type="button" class="btn sm" id="logoPick">'+t("f.logoPick")+'</button>'
    +(S.settings.logo?'<button type="button" class="btn sm ghost danger" id="logoClear">'+t("f.logoClear")+'</button>':'')
    +'</div><div class="hint">'+t("f.logoH")+'</div></div>';
  form(t("sp.look"),[
    {k:"theme",label:t("f.theme"),type:"select",options:[["light",t("th.light")],["dark",t("th.dark")],["auto",t("th.auto")]],def:S.settings.theme||"dark"},
    {k:"accent",label:t("f.custom"),def:cur}
  ],null,function(v){
    S.settings.theme=v.theme;
    if(/^#?[0-9a-fA-F]{6}$/.test((v.accent||"").trim()))
      S.settings.accent=(v.accent.trim().charAt(0)==="#"?v.accent.trim():"#"+v.accent.trim());
    applyTheme();
  },swHTML+logoHTML);
  // live preview + logo handling — bound to the modal itself so it dies with the modal
  var host=el("modalHost").querySelector(".modal");
  host.addEventListener("click",function(e){
    var sw=e.target.closest("[data-sw]");
    if(sw){
      document.documentElement.style.setProperty("--brand",sw.dataset.sw);
      host.querySelector('[name="accent"]').value=sw.dataset.sw;
      Array.prototype.forEach.call(host.querySelectorAll("[data-sw]"),function(b){
        b.setAttribute("aria-pressed",String(b===sw));});
    }
    if(e.target.id==="logoClear"){S.settings.logo="";save();el("modalHost").innerHTML="";render();}
    if(e.target.id==="logoPick"){
      var inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
      inp.onchange=function(){
        var fl=inp.files[0]; if(!fl) return;
        if(fl.size>400*1024){alert(t("f.logoBig"));return;}
        var rd=new FileReader();
        rd.onload=function(){S.settings.logo=rd.result;save();el("modalHost").innerHTML="";render();};
        rd.readAsDataURL(fl);
      };
      inp.click();
    }
  });
  var th=host.querySelector('[name="theme"]');
  if(th) th.addEventListener("change",function(){
    var v=th.value==="auto"?((window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"):th.value;
    document.documentElement.setAttribute("data-theme",v);});
}

async function handleAppointmentConfirmation(){
  var params=new URLSearchParams(location.search);
  var appointmentId=params.get("confirmAppointment");
  if(!appointmentId||!SB) return;

  var ok=confirm(LANG==="ar"
    ?"هل تم الإجراء/الموعد؟ اضغط موافق لتسجيله كمنتهي."
    :"Was the appointment completed? Tap OK to mark it done.");
  if(!ok) return;

  try{
    var session=(await SB.auth.getSession()).data.session;
    if(!session||!session.access_token) throw new Error("sign_in");
    var response=await fetch("https://studio-ledger-mcp.reahwy66.workers.dev/appointments/complete",{
      method:"POST",
      headers:{"content-type":"application/json","authorization":"Bearer "+session.access_token},
      body:JSON.stringify({id:appointmentId})
    });
    var data={}; try{data=await response.json();}catch(_e){}
    if(!response.ok||!data.ok) throw new Error(data.error||("HTTP "+response.status));
    history.replaceState(null,"",location.pathname+location.hash);
    alert(LANG==="ar"?"تم تسجيل الموعد كمنتهي ✓":"Appointment marked complete ✓");
    try{await Store.load().then(function(d){if(d&&d.settings)S=d;});}catch(_e){}
    render();
  }catch(e){
    alert((LANG==="ar"?"تعذّر تأكيد الموعد: ":"Couldn’t confirm appointment: ")+String(e&&e.message||e));
  }
}
