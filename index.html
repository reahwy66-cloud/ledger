<title>Studio Ledger</title>

<style>
:root{
  --ground:#131916;--panel:#1B2320;--panel-2:#232C28;--line:#2F3A34;
  --bone:#F5F2EA;--mute:#7E8A83;--brand:#9DA79F;
  --cyan:#8FB0B8;--green:#7FBF9C;--coral:#DE8A6E;
  --brand-w:rgba(157,167,159,.14);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --ar:"IBM Plex Sans Arabic","Noto Sans Arabic","Dubai",Tahoma,sans-serif;
  --sans:"IBM Plex Sans","Helvetica Neue",-apple-system,system-ui,"Segoe UI",sans-serif;
}
[data-theme="light"]{
  --ground:#F5F2EA;--panel:#FFFFFF;--panel-2:#EFEBE1;--line:#E1DCD0;
  --bone:#232C27;--mute:#78847C;--brand:#4A6B5A;
  --cyan:#4E7480;--green:#2E7A57;--coral:#B0563C;
  --brand-w:rgba(74,107,90,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--bone);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body[dir="rtl"]{font-family:var(--ar);line-height:1.75}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px}

/* ── masthead ── */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:24px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.stamp{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;overflow:hidden;
  background:var(--panel-2);border:1px solid var(--line);color:var(--brand);font-size:16px;font-weight:600}
.stamp img{width:100%;height:100%;object-fit:cover;display:block}
.stamp.logo{background:var(--bone);border-color:transparent}
[data-theme="light"] .stamp.logo{background:var(--panel);border-color:var(--line)}
.brand h1{font-size:19px;margin:0;letter-spacing:-.01em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:3px}
body[dir="rtl"] .brand small{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:11.5px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthpick{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 6px}
.monthpick button{background:none;border:0;color:var(--mute);font-size:16px;cursor:pointer;padding:2px 9px;border-radius:6px;line-height:1}
.monthpick button:hover{background:var(--panel-2);color:var(--bone)}
.monthpick .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.04em;min-width:100px;text-align:center;cursor:pointer;border-radius:6px;padding:3px 0}
.monthpick .lbl:hover{background:var(--panel-2)}
.chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--bone);line-height:1.2}
.chip:hover{border-color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.owner{background:var(--brand)}.dot.manager{background:var(--cyan)}.dot.accountant{background:var(--green)}

/* ── tabs ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font-family:var(--mono);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
body[dir="rtl"] .tabs button{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:13px}
.tabs button:hover{color:var(--bone)}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* ── generic ── */
h2{font-size:15px;margin:0 0 3px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
body[dir="rtl"] .eyebrow{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12px}
.sec{margin-top:26px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.pos{color:var(--green)}.neg{color:var(--coral)}.acc{color:var(--brand)}.cy{color:var(--cyan)}.mut{color:var(--mute)}

/* ── buttons ── */
.btn{background:var(--panel-2);border:1px solid var(--line);color:var(--bone);font-family:var(--mono);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;padding:9px 14px;border-radius:9px;cursor:pointer}
body[dir="rtl"] .btn{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12.5px}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--ground);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:10px}
body[dir="rtl"] .btn.sm{font-size:11.5px}
.btn.danger{color:var(--coral)}
.btn.danger:hover{border-color:var(--coral)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ── KPI strip ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .v{font-family:var(--mono);font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  margin-top:6px;display:block;direction:ltr;unicode-bidi:isolate;line-height:1.1}
body[dir="rtl"] .kpi .v{text-align:right}
.kpi .n{font-size:11.5px;color:var(--mute);margin-top:5px;display:block}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--line)}
.kpi.in::after{background:var(--green)}.kpi.out::after{background:var(--coral)}
.kpi.net::after{background:var(--brand)}.kpi.you::after{background:var(--cyan)}

/* ── the cascade ── */
.ledger{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ledger-head{padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fall{padding:6px 18px 10px}
.step{display:grid;grid-template-columns:158px 1fr 112px;gap:12px;align-items:center;padding:7px 0}
.step .lab{font-size:12.5px;color:var(--mute)}
.step .lab b{color:var(--bone);font-weight:500;display:block;font-size:13px}
.step.total{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.track{height:26px;background:var(--ground);border-radius:4px;position:relative;overflow:hidden}
.bar{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:4px;width:0;transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar.keep{background:var(--brand);background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 72%,#000))}
.bar.cut{background:var(--coral);background:repeating-linear-gradient(45deg,var(--coral),var(--coral) 6px,color-mix(in srgb,var(--coral) 70%,#000) 6px,color-mix(in srgb,var(--coral) 70%,#000) 12px);opacity:.85}
.step .amt{text-align:end;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.step.total .amt{font-size:16px;font-weight:600}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 18px}
.slice{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--ground)}
.slice.mine{border-color:var(--brand)}
.slice .who{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
body[dir="rtl"] .slice .who{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12px}
.slice .big{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;display:block;margin:6px 0 2px;
  direction:ltr;unicode-bidi:isolate;line-height:1.1}
body[dir="rtl"] .slice .big{text-align:right}
.slice .note{font-size:11.5px;color:var(--mute)}
.carve{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;font-size:12px}
.carve b{color:var(--bone)}

/* ── tables ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
  font-weight:400;padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
body[dir="rtl"] th{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12px}
td{padding:11px 10px;border-bottom:1px solid var(--panel-2);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.sum td{border-top:1px solid var(--line);border-bottom:0;padding-top:12px}
td.r,th.r{text-align:end}
.lnk{color:var(--bone);text-decoration:none;border-bottom:1px dotted var(--mute);font-weight:600}
.lnk:hover{color:var(--brand);border-bottom-color:var(--brand)}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
body[dir="rtl"] .pill{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:11px}
.pill.on{color:var(--green);border-color:var(--line);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.pill.amb{color:var(--brand);border-color:var(--line);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.pill.cy{color:var(--cyan);border-color:var(--line);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.empty{text-align:center;padding:34px 14px;color:var(--mute);font-size:13px}

.note{background:var(--brand-w);border:1px solid var(--line);border-color:color-mix(in srgb,var(--brand) 30%,transparent);
  border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--bone);opacity:.92}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

/* ── modal ── */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.72);display:flex;align-items:flex-start;justify-content:center;
  padding:5vh 16px 40px;overflow:auto;z-index:60}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;padding:22px}
.modal h3{margin:0 0 16px;font-size:15px;font-weight:600}
.f{margin-bottom:13px}
.f label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
body[dir="rtl"] .f label{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:12px}
.f .hint{font-size:11.5px;color:var(--mute);margin-top:5px}
input,select,textarea{width:100%;background:var(--ground);border:1px solid var(--line);color:var(--bone);
  border-radius:9px;padding:10px 11px;font-family:inherit;font-size:13.5px}
input[type=number],input[type=date],input[type=month],input[type=time],input[type=password]{font-family:var(--mono);direction:ltr;text-align:start}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:9px}
.chk input{width:auto;accent-color:var(--brand)}
.chk label{margin:0!important;font-family:inherit!important;text-transform:none!important;letter-spacing:0!important;
  font-size:13px!important;color:var(--bone)!important}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.sw button[aria-pressed="true"]{border-color:var(--bone);box-shadow:inset 0 0 0 2px var(--panel)}

/* ── calendar ── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center;padding-bottom:6px}
body[dir="rtl"] .cal .dow{font-family:var(--ar);letter-spacing:0;text-transform:none;font-size:11.5px}
.day{background:var(--ground);border:1px solid var(--line);border-radius:9px;min-height:84px;padding:6px;cursor:pointer;position:relative}
.day:hover{border-color:var(--mute)}
.day.mute{opacity:.32;cursor:default}
.day.off{border-style:dashed}
.day.today{border-color:var(--brand)}
.day .dn{font-family:var(--mono);font-size:11px;color:var(--mute)}
.day .ev{background:var(--brand-w);border-inline-start:2px solid var(--brand);border-radius:3px;font-size:10.5px;
  padding:2px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .load{position:absolute;inset-inline-end:6px;top:6px;font-family:var(--mono);font-size:9px;color:var(--brand)}
.day .load.over{color:var(--coral)}

/* ── gate ── */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatebox{width:100%;max-width:440px}
.gatebox .head{text-align:center;margin-bottom:26px}
.gatebox .stamp{margin:0 auto 16px;width:64px;height:64px;border-radius:18px;font-size:25px}
.gatebox h1{font-size:22px;margin:0 0 4px;font-weight:600}
.roles{display:grid;gap:10px}
.rolebtn{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;cursor:pointer;text-align:start;width:100%;color:var(--bone);font-family:inherit;font-size:14px}
.rolebtn:hover{border-color:var(--brand)}
.rolebtn .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:8px}
.rolebtn .ic.owner{background:var(--brand-w);color:var(--brand)}
.rolebtn .ic.manager{background:var(--panel-2);background:color-mix(in srgb,var(--cyan) 14%,transparent);color:var(--cyan)}
.rolebtn .ic.accountant{background:var(--panel-2);background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.rolebtn b{font-weight:600}
.rolebtn small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px;font-weight:400;line-height:1.45}
.langsw{display:flex;gap:6px;justify-content:center;margin-top:22px}
.langsw button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:7px 16px;cursor:pointer;font-family:inherit;font-size:12.5px}
.langsw button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-w)}

.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-inline-start:32px;margin-bottom:12px;font-size:13px;line-height:1.6}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:1px;width:22px;height:22px;border-radius:7px;
  background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--brand)}
code{background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-family:var(--mono);
  font-size:11.5px;color:var(--cyan);direction:ltr;display:inline-block;word-break:break-all;line-height:1.7}

@media(max-width:820px){
  .two,.three,.fork{grid-template-columns:1fr}
  .step{grid-template-columns:1fr 96px;gap:6px 10px}
  .step .track{grid-column:1/-1;order:3;height:14px;margin-top:2px}
  .wrap{padding:0 13px 70px}
  .kpis{grid-template-columns:1fr 1fr}
  .day{min-height:64px}
  .fall,.fork,.ledger-head{padding-inline:14px}
}
@media(max-width:420px){.kpis{grid-template-columns:1fr}.brand small{display:none}}
@media print{
  .tabs,.tools,.btn,.note{display:none!important}
  body{background:#fff;color:#000}
  .card,.ledger,.kpi{border-color:#ccc;break-inside:avoid}
  .wrap{max-width:none;padding:0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

var SB=null, SYNC="", PULLED={}, RT=null, PUSHT=null;
var TBL=[["customers","clients"],["employees","team"],["work","work"],["payments","payments"],
         ["advances","advances"],["costs","costs"],["shoots","calendar"],["outside","outside"],["projects","outside"]];

async function sbClient(url,key){
  var m=await import("https://esm.sh/@supabase/supabase-js@2.45.4");
  return m.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true}});
}
function setSync(v){SYNC=v;var n=el("syncDot");if(n)n.textContent=v?t(v):"";}

async function pull(){
  PULLED={};
  setSync("cl.pulling");
  for(var i=0;i<TBL.length;i++){
    var key=TBL[i][0];
    var r=await SB.from(key).select("id,data");
    if(r.error) continue;           // no permission for this table — leave local copy alone
    PULLED[key]=true;
    S[key]=r.data.map(function(row){return Object.assign({id:row.id},row.data);});
  }
  var st=await SB.from("settings").select("data").eq("id",1).maybeSingle();
  if(!st.error&&st.data&&st.data.data&&Object.keys(st.data.data).length){
    var localOnly={theme:S.settings.theme,accent:S.settings.accent,lang:S.settings.lang};
    S.settings=Object.assign({},S.settings,st.data.data,localOnly);
    PULLED.settings=true;
  }
  setSync("cl.synced");
}

function queuePush(){
  if(MODE!=="cloud"||!SB) return;
  clearTimeout(PUSHT);
  setSync("cl.syncing");
  PUSHT=setTimeout(function(){push();},700);
}
async function push(){
  try{
    for(var i=0;i<TBL.length;i++){
      var key=TBL[i][0], sec=TBL[i][1];
      if(!PULLED[key]||!can(sec)) continue;   // never overwrite what we were not allowed to read
      var rows=(S[key]||[]).map(function(o){
        var d=Object.assign({},o); delete d.id;
        return {id:o.id,data:d,updated_at:new Date().toISOString()};
      });
      if(rows.length) await SB.from(key).upsert(rows);
      var ids=rows.map(function(r){return r.id;});
      var del=SB.from(key).delete();
      if(ids.length) del=del.not("id","in","("+ids.map(function(x){return '"'+x+'"';}).join(",")+")");
      await del.neq("id","__none__");
    }
    if(can("setup")){
      var out=Object.assign({},S.settings); delete out.theme; delete out.accent; delete out.lang;
      await SB.from("settings").upsert({id:1,data:out,updated_at:new Date().toISOString()});
    }
    setSync("cl.synced");
  }catch(e){ setSync("cl.err"); }
}

/* one-time upload of whatever is on this device */
async function pushEverything(){
  PULLED={}; TBL.forEach(function(x){PULLED[x[0]]=true;}); PULLED.settings=true;
  await push(); await pull(); render();
}

function watch(){
  if(RT) return;
  RT=SB.channel("sl");
  ["customers","employees","work","payments","advances","costs","shoots","outside","projects","settings","profiles"]
    .forEach(function(tb){
      RT.on("postgres_changes",{event:"*",schema:"public",table:tb},function(){
        clearTimeout(RT._t); RT._t=setTimeout(async function(){await pull();render();},400);
      });
    });
  RT.subscribe();
}

async function loadProfile(){
  var u=(await SB.auth.getUser()).data.user;
  if(!u) return null;
  var r=await SB.from("profiles").select("*").eq("id",u.id).maybeSingle();
  if(r.error||!r.data) return {id:u.id,email:u.email,name:u.email,role:"staff",active:false,perms:{tabs:[],edit:[],personal:false}};
  return r.data;
}

  var c=cfg();

  catch(e){ alert(t("cl.lib")); return false; }
  MODE="cloud";
  var sess=(await SB.auth.getSession()).data.session;
  if(!sess){ renderAuth(); return true; }
  ME=await loadProfile();

  await pull(); watch(); render();
  return true;
}

/* ═════════════ engine ═════════════ */
function inMonth(d,m){return (d||"").slice(0,7)===m;}
var _cc={};
function clearCalc(){_cc={};}
function calc(m){
  if(_cc[m]) return _cc[m];
  return _cc[m]=_calc(m);
}
function _calc(m){
  var work=S.work.filter(function(w){return inMonth(w.date,m);});
  var clients=[],revenue=0,adSpend=0;
  S.customers.forEach(function(c){
    if(!c.active)return;
    var mine=work.filter(function(w){return w.customerId===c.id;});
    var vids=mine.filter(function(w){return w.type==="video";}).reduce(function(a,w){return a+(+w.qty||0);},0);
    var posts=mine.filter(function(w){return w.type==="post";}).reduce(function(a,w){return a+(+w.qty||0);},0);
    var amt=0,basis="";
    if(c.billing==="package"){amt=+c.monthlyFee||0;adSpend+=+c.adSpend||0;basis=t("b.packageL");}
    else{amt=vids*(+c.rate||0);basis=vids+" × "+money(+c.rate||0);}
    revenue+=amt;clients.push({c:c,vids:vids,posts:posts,amt:amt,basis:basis});
  });
  var payroll=0,people=[];
  S.employees.forEach(function(e){
    if(!e.active||e.payType==="percent")return;
    var pay=0,basis="";
    if(e.payType==="monthly"){pay=+e.rate||0;basis=t("p.monthly");}
    else{
      var mine=work.filter(function(w){return w.editorId===e.id;});
      var q=mine.reduce(function(a,w){return a+(+w.qty||0);},0);
      var ov=mine.reduce(function(a,w){return a+((w.amount!==""&&w.amount!=null)?+w.amount:0);},0);
      var noOv=mine.filter(function(w){return w.amount===""||w.amount==null;}).reduce(function(a,w){return a+(+w.qty||0);},0);
      pay=noOv*(+e.rate||0)+ov; basis=q+" × "+money(+e.rate||0);
    }
    payroll+=pay;people.push({e:e,pay:pay,basis:basis});
  });
  var opex=0,costs=[];
  S.costs.forEach(function(x){
    var hit=x.recurring?((x.date||"").slice(0,7)<=m):inMonth(x.date,m);
    if(!hit)return; opex+=+x.amount||0; costs.push(x);
  });
  var rentTop=S.settings.rentMode==="expense"?(+S.settings.rentFlat||0):0;
  opex+=rentTop;
  var totalOut=payroll+adSpend+opex, net=revenue-totalOut;
  var mp=+S.settings.managerPct||0;
  var mgr=net>0?net*mp/100:0, yours=net-mgr;
  var rentSet=(S.settings.rentMode==="myshare"&&yours>0)?yours*(+S.settings.rentSharePct||0)/100:0;
  var take=yours-rentSet;
  var outside=S.outside.filter(function(o){return o.active;})
    .reduce(function(a,o){return a+(o.kind==="income"?(+o.amount||0):-(+o.amount||0));},0);
  var projIn=0;
  S.projects.forEach(function(p){p.entries.forEach(function(e){if(inMonth(e.date,m))projIn+=+e.yours||0;});});
  return{clients:clients,revenue:revenue,people:people,payroll:payroll,adSpend:adSpend,costs:costs,
    opex:opex,rentTop:rentTop,totalOut:totalOut,net:net,mgr:mgr,mp:mp,yours:yours,rentSet:rentSet,
    take:take,outside:outside,projIn:projIn,pocket:take+outside+projIn};
}
/* Full statement for one client, up to and including month `thru`.
   balance > 0 = they owe us.  balance < 0 = they are in credit. */
function stmt(c,thru){
  var lines=[],billed=0,paid=0;
  var open=+c.openingDue||0, adv=+c.credit||0;
  if(open) {lines.push({date:(c.startMonth||thru)+"-01",desc:t("line.open"),charge:open,paid:0}); billed+=open;}
  if(adv)  {lines.push({date:(c.startMonth||thru)+"-01",desc:t("line.adv"),charge:0,paid:adv}); paid+=adv;}

  if(c.billing==="package"){
    var m=c.startMonth||thru, guard=0, stop=c.endMonth&&c.endMonth<thru?c.endMonth:thru;
    while(m<=stop && guard++<180){
      var fee=+c.monthlyFee||0;
      if(fee){lines.push({date:m+"-01",desc:t("line.sub",{m:monthName(m)}),charge:fee,paid:0}); billed+=fee;}
      m=addMonth(m,1);
    }
  }else{
    S.work.filter(function(w){return w.customerId===c.id&&w.type==="video"&&(w.date||"").slice(0,7)<=thru;})
      .forEach(function(w){
        var amt=(+w.qty||0)*(+c.rate||0);
        lines.push({date:w.date,desc:w.qty+" × "+t("d.video")+(w.note?" — "+w.note:""),charge:amt,paid:0});
        billed+=amt;});
  }
  S.payments.filter(function(x){return x.customerId===c.id&&(x.date||"").slice(0,7)<=thru;})
    .forEach(function(x){
      lines.push({date:x.date,desc:t("line.pay")+(x.note?" — "+x.note:"")+(x.method?" ("+t("m."+x.method)+")":""),charge:0,paid:+x.amount||0,pid:x.id});
      paid+=+x.amount||0;});

  lines.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  var run=0; lines.forEach(function(l){run+=l.charge-l.paid; l.run=run;});
  return {lines:lines,billed:billed,paid:paid,balance:billed-paid};
}

/* what has actually been delivered */
function delivered(c,month){
  var w=S.work.filter(function(x){return x.customerId===c.id&&(month?inMonth(x.date,month):true);});
  var o={};
  ["video","post","design","task"].forEach(function(k){
    o[k]=w.filter(function(x){return x.type===k;}).reduce(function(a,x){return a+(+x.qty||0);},0);});
  return o;
}
function deliveredChips(o){
  var out=["video","post","design","task"].filter(function(k){return o[k]>0;})
    .map(function(k){return '<span class="pill">'+o[k]+' '+t("d."+k)+'</span>';});
  return out.length?out.join(" "):'<span class="mut">'+t("cd.none")+'</span>';
}
/* What one person earned in a given month (manager = his share of profit). */
function earnedIn(e,m){
  if(e.payType==="percent") return calc(m).mgr;
  var hit=calc(m).people.filter(function(x){return x.e.id===e.id;})[0];
  return hit?hit.pay:0;
}
/* Month-by-month ledger: earned − advances, with unrecovered advances carried forward.
   Assumes you settle the net due at the end of each month. */
function empLedger(e,thru){
  var ds=[];
  S.advances.filter(function(a){return a.employeeId===e.id;}).forEach(function(a){ds.push((a.date||"").slice(0,7));});
  S.work.filter(function(w){return w.editorId===e.id;}).forEach(function(w){ds.push((w.date||"").slice(0,7));});
  ds.sort();
  var first=ds.length?ds[0]:thru;
  var floor=addMonth(thru,-23);
  if(first<floor) first=floor;
  if(first>thru) first=thru;
  var rows=[],carry=0,m=first,guard=0;
  while(m<=thru&&guard++<40){
    var earned=earnedIn(e,m);
    var adv=S.advances.filter(function(a){return a.employeeId===e.id&&inMonth(a.date,m);})
      .reduce(function(s2,a){return s2+(+a.amount||0);},0);
    var due=earned-adv-carry;
    var payout=due>0?due:0, out=due<0?-due:0;
    rows.push({month:m,earned:earned,adv:adv,carryIn:carry,payout:payout,carryOut:out});
    carry=out; m=addMonth(m,1);
  }
  var cur=rows[rows.length-1]||{month:thru,earned:0,adv:0,carryIn:0,payout:0,carryOut:0};
  return {rows:rows,cur:cur};
}
function totalDue(thru){
  var sum=0,cnt=0;
  S.customers.forEach(function(c){var b=stmt(c,thru).balance; if(b>0.005){sum+=b;cnt++;}});
  return {sum:sum,count:cnt};
}

/* ═════════════ CALENDAR ═════════════ */
function vCalendar(){
  var w=can("calendar");
  var p=MONTH.split("-"),Y=+p[0],M=+p[1]-1;
  var start=new Date(Y,M,1).getDay(), days=new Date(Y,M+1,0).getDate();
  var cap=+S.settings.dayCapacity||0, off=+S.settings.offDay;
  var h='<div class="sec"><div class="rowhead"><div><h2>'+t("cal.t")+'</h2>'
   +'<p class="sub" style="margin:0">'+t("cal.s",{h:cap})+'</p></div>'
   +(w?'<button class="btn primary" data-act="newshoot">'+t("cal.add")+'</button>':'')+'</div>'
   +'<div class="card"><div class="cal">';
  t("dows").forEach(function(d){h+='<div class="dow">'+d+'</div>';});
  for(var i=0;i<start;i++) h+='<div class="day mute"></div>';
  for(var d=1;d<=days;d++){
    var iso=Y+"-"+String(M+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var dow=new Date(Y,M,d).getDay();
    var evs=S.shoots.filter(function(s){return s.date===iso;});
    var load=evs.reduce(function(a,s){return a+(+s.hours||0);},0);
    var isOff=dow===off;
    h+='<div class="day'+(isOff?" off":"")+(iso===todayISO()?" today":"")+'"'+(w?' data-act="dayclick" data-date="'+iso+'"':' style="cursor:default"')+'>'
     +'<div class="dn">'+d+(isOff?' <span class="cy">'+t("cal.off")+'</span>':'')+'</div>'
     +(load?'<span class="load'+(!isOff&&load>cap?" over":"")+'">'+load+'h</span>':'')
     +evs.map(function(s){var c=S.customers.filter(function(y){return y.id===s.customerId;})[0];
       return '<div class="ev">'+esc(c?c.name:s.title)+'</div>';}).join("")+'</div>';
  }
  h+='</div></div>';
  var up=S.shoots.filter(function(s){return inMonth(s.date,MONTH);}).sort(function(a,b){return a.date>b.date?1:-1;});
  h+='<div class="sec card"><h2>'+t("cal.booked")+'</h2><div class="tbl-wrap"><table><thead><tr>'
   +'<th>'+t("th.date")+'</th><th>'+t("th.time")+'</th><th>'+t("th.client")+'</th><th>'+t("th.shoot")+'</th>'
   +'<th class="r">'+t("th.hours")+'</th><th></th></tr></thead><tbody>';
  if(!up.length) h+='<tr><td colspan="6" class="empty">'+t("cal.none")+'</td></tr>';
  up.forEach(function(s){
    var c=S.customers.filter(function(y){return y.id===s.customerId;})[0];
    h+='<tr><td>'+n(esc(s.date))+'</td><td>'+n(esc(s.time||"—"))+'</td><td>'+esc(c?c.name:"—")+'</td>'
     +'<td>'+esc(s.title)+'</td><td class="r">'+n((s.hours||0)+"h")+'</td>'
     +'<td class="r">'+(w?'<button class="btn sm ghost" data-act="editshoot" data-id="'+s.id+'">'+t("edit")+'</button>':'')+'</td></tr>';
  });
  return h+'</tbody></table></div></div></div>';
}

     +'<td>'+((own||pm.personal)?'<span class="pill on">'+t("st.active")+'</span>':'<span class="pill">'+t("us.off")+'</span>')+'</td>'
     +'<td class="r">'+(own?'<span class="mut" style="font-size:11.5px">'+t("us.ownerLock")+'</span>'

function userForm(u){
  var pm=JSON.parse(JSON.stringify(u.perms||{tabs:[],edit:[],personal:false}));
  var box=function(list,keyName,sel){
    return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:4px">'
      +list.map(function(k){
        var on=(sel||[]).indexOf(k)>=0;
        return '<label class="chk" style="cursor:pointer"><input type="checkbox" data-grp="'+keyName+'" value="'+k+'"'+(on?" checked":"")+'>'
          +'<span style="font-size:13px">'+t("sec."+k)+'</span></label>';}).join("")
      +'</div>';
  };
  var body='<div class="f"><label>'+t("us.presets")+'</label>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
    +[["manager","us.p.manager"],["acct","us.p.acct"],["view","us.p.view"],["none","us.p.none"]].map(function(x){
       return '<button type="button" class="btn sm" data-preset="'+x[0]+'">'+t(x[1])+'</button>';}).join("")
    +'</div></div>'
    +'<div class="f"><label>'+t("us.canSee")+'</label>'+box(SEC_TABS,"tabs",pm.tabs)+'</div>'
    +'<div class="f"><label>'+t("us.canEdit")+'</label>'+box(SEC_EDIT,"edit",pm.edit)+'</div>'
    +'<div class="f"><label class="chk" style="cursor:pointer"><input type="checkbox" id="pPersonal"'+(pm.personal?" checked":"")+'>'
      +'<span style="font-size:13px">'+t("us.personal")+'</span></label>'
      +'<div class="hint">'+t("us.personalH")+'</div></div>'
    +'<div class="f"><label class="chk" style="cursor:pointer"><input type="checkbox" id="pActive"'+(u.active?" checked":"")+'>'
      +'<span style="font-size:13px">'+t("us.on")+'</span></label></div>';

  el("modalHost").innerHTML='<div class="scrim"><div class="modal" role="dialog" aria-modal="true">'
    +'<h3>'+esc(t("us.edit",{n:u.name||u.email}))+'</h3>'+body
    +'<div class="acts"><button class="btn ghost" id="uCancel">'+t("cancel")+'</button>'
    +'<button class="btn primary" id="uSave">'+t("save")+'</button></div></div></div>';
  var host=el("modalHost").querySelector(".modal");
  host.addEventListener("click",function(e){
    var pb=e.target.closest("[data-preset]");
    if(pb){
      var pr=PRESETS[pb.dataset.preset];
      Array.prototype.forEach.call(host.querySelectorAll('[data-grp]'),function(cb){
        cb.checked=(pr[cb.dataset.grp]||[]).indexOf(cb.value)>=0;});
      el("pPersonal").checked=!!pr.personal;
    }
  });
  el("uCancel").onclick=function(){el("modalHost").innerHTML="";};
  el("uSave").onclick=async function(){
    var out={tabs:[],edit:[],personal:el("pPersonal").checked};
    Array.prototype.forEach.call(host.querySelectorAll('[data-grp]'),function(cb){
      if(cb.checked) out[cb.dataset.grp].push(cb.value);});
    el("uSave").disabled=true;
    var r=await SB.from("profiles").update({perms:out,active:el("pActive").checked}).eq("id",u.id);
    el("modalHost").innerHTML="";
    if(r.error) alert(r.error.message); else await loadUsers();
  };

/* ═════════════ forms ═════════════ */
function form(title,fields,vals,onSave,extra,saveLabel){
  var body=fields.map(function(f){
    var v=(vals&&vals[f.k]!=null)?vals[f.k]:(f.def!=null?f.def:"");
    var i;
    if(f.type==="select") i='<select name="'+f.k+'">'+f.options.map(function(o){
        return '<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?" selected":"")+'>'+esc(o[1])+'</option>';}).join("")+'</select>';
    else if(f.type==="textarea") i='<textarea name="'+f.k+'" rows="2">'+esc(v)+'</textarea>';
    else if(f.type==="check") i='<div class="chk"><input type="checkbox" name="'+f.k+'" id="k_'+f.k+'"'+(v?" checked":"")+'>'
        +'<label for="k_'+f.k+'">'+esc(f.checkLabel||"")+'</label></div>';
    else i='<input type="'+(f.type||"text")+'" name="'+f.k+'" value="'+esc(v)+'"'+(f.step?' step="'+f.step+'"':"")+'>';
    return '<div class="f" data-field="'+f.k+'"'+(f.showIf?" data-showif='"+JSON.stringify(f.showIf)+"'":"")+'>'
      +(f.type==="check"?"":'<label>'+esc(f.label)+'</label>')+i
      +(f.hint?'<div class="hint">'+esc(f.hint)+'</div>':"")+'</div>';
  }).join("");
  el("modalHost").innerHTML='<div class="scrim"><div class="modal" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3>'
   +'<div id="formBody">'+body+'</div>'+(extra||"")
   +'<div class="acts">'+((vals&&vals.id)?'<button class="btn danger ghost" id="fDel">'+t("del")+'</button>':"")
   +'<button class="btn ghost" id="fCancel">'+t("cancel")+'</button>'
   +'<button class="btn primary" id="fSave">'+(saveLabel||t("save"))+'</button></div></div></div>';
  function toggles(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-showif]"),function(d){
      var c=JSON.parse(d.getAttribute("data-showif"));
      var cur=el("formBody").querySelector('[name="'+c.k+'"]');
      d.style.display=(cur&&c.in.indexOf(cur.value)>=0)?"":"none";});
  }
  toggles();
  el("formBody").addEventListener("change",toggles);
  var scrim=document.querySelector(".scrim");
  scrim.addEventListener("mousedown",function(e){if(e.target===this)close();});
  el("fCancel").onclick=close;
  if(el("fDel")) el("fDel").onclick=function(){if(confirm(t("confirmDel"))){onSave(null);close();save();render();}};
  el("fSave").onclick=function(){
    var out={};
    fields.forEach(function(f){var q=el("formBody").querySelector('[name="'+f.k+'"]');
      out[f.k]=f.type==="check"?q.checked:(f.type==="number"?(q.value===""?"":+q.value):q.value);});
    close(); onSave(out); save(); if(ROLE) render();
  };
  function close(){el("modalHost").innerHTML="";applyTheme();}
}

    {k:"yours",label:t("f.yourcut"),type:"number",step:"0.01",hint:t("f.yourcutH",{p:mine?mine.pct:"?"})}
  ],null,function(v){v.id=uid();p.entries.push(v);});
}

/* ═════════════ events ═════════════ */
document.addEventListener("click",function(ev){
  var g=ev.target.closest("[data-role]");
  if(g){tryEnter(g.dataset.role);return;}
  var lb=ev.target.closest("[data-lang]");
  if(lb){LANG=lb.dataset.lang;S.settings.lang=LANG;save();if(ROLE)render();else renderGate();return;}
  var tb=ev.target.closest("[data-tab]");
  if(tb){if(tb.dataset.tab!==TAB){SEL=null;SELE=null;}TAB=tb.dataset.tab;render();return;}
  var a=ev.target.closest("[data-act]"); if(!a) return;
  var id=a.dataset.id, act=a.dataset.act;
  var f=function(arr){return arr.filter(function(x){return x.id===id;})[0];};

  if(act==="mprev"){MONTH=addMonth(MONTH,-1);render();}
  else if(act==="mnext"){MONTH=addMonth(MONTH,1);render();}
  else if(act==="lang"){LANG=LANG==="ar"?"en":"ar";S.settings.lang=LANG;save();render();}
  else if(act==="logout"){ if(MODE==="cloud"){cloudManage();} else {ROLE=null;renderGate();} }
  else if(act==="opencli"){ev.preventDefault();SEL=id;TAB="clients";render();}
  else if(act==="closecli"){SEL=null;render();}
  else if(act==="openemp"){ev.preventDefault();SELE=id;TAB="team";render();}
  else if(act==="closeemp"){SELE=null;render();}
  else if(act==="newadv") advForm(null,id);
  else if(act==="editadv") advForm(f(S.advances));
  else if(act==="newpay") payForm(null,id);
  else if(act==="editpay") payForm(f(S.payments));
  else if(act==="newclient") clientForm(null);
  else if(act==="editclient") clientForm(f(S.customers));
  else if(act==="newemp") empForm(null);
  else if(act==="editemp") empForm(f(S.employees));
  else if(act==="newwork") workForm(null);
  else if(act==="editwork") workForm(f(S.work));
  else if(act==="newcost") costForm(null);
  else if(act==="editcost") costForm(f(S.costs));
  else if(act==="newshoot") shootForm(null);
  else if(act==="editshoot") shootForm(f(S.shoots));
  else if(act==="dayclick") shootForm(null,a.dataset.date);
  else if(act==="newoutside") outsideForm(null);
  else if(act==="editoutside") outsideForm(f(S.outside));
  else if(act==="newproj") projForm(null);
  else if(act==="editproj") projForm(f(S.projects));
  else if(act==="projpay") projPay(f(S.projects));
  else if(act==="install") installGuide();
  else if(act==="editlook") lookForm();
  else if(act==="cloudon") cloudForm();
  else if(act==="cloudmanage") cloudManage();
  else if(act==="cloudoff"){clearCfg();location.reload();}
  else if(act==="pwa") pwaGuide();
  else if(act==="edituser"){var u=USERS.filter(function(x){return x.id===id;})[0];if(u)userForm(u);}
  else if(act==="signout"){(async function(){if(SB)await SB.auth.signOut();ME=null;renderAuth();})();}
  else if(act==="theme"){S.settings.theme=(S.settings.theme==="dark")?"light":"dark";save();render();}
  else if(act==="mtoday"){MONTH=ymNow();render();}
  else if(act==="print") window.print();
  else if(act==="addrent"){S.settings.rentSetAside=(+S.settings.rentSetAside||0)+(+a.dataset.amt||0);save();render();}
  else if(act==="editsplit") form(t("sp.split"),[{k:"managerPct",label:t("f.mgrpct"),type:"number",step:"0.5",def:S.settings.managerPct}],
    null,function(v){S.settings.managerPct=+v.managerPct||0;
      var m=S.employees.filter(function(e){return e.payType==="percent";})[0]; if(m)m.rate=S.settings.managerPct;});
  else if(act==="editrent") form(t("sp.rentBtn"),[
    {k:"rentMode",label:t("f.whopays"),type:"select",options:[["myshare",t("f.rentmine")],["expense",t("f.rentco")]]},
    {k:"rentSharePct",label:t("f.pctaside"),type:"number",step:"0.5",showIf:{k:"rentMode",in:["myshare"]}},
    {k:"rentFlat",label:t("f.offtop"),type:"number",step:"0.01",showIf:{k:"rentMode",in:["expense"]}},
    {k:"rentAnnual",label:t("f.yearly"),type:"number",step:"0.01"},
    {k:"rentMonthsLeft",label:t("f.monthsleft"),type:"number"},
    {k:"rentSetAside",label:t("f.saved"),type:"number",step:"0.01"}
  ],S.settings,function(v){Object.assign(S.settings,{rentMode:v.rentMode,rentSharePct:+v.rentSharePct||0,
    rentFlat:+v.rentFlat||0,rentAnnual:+v.rentAnnual||0,rentMonthsLeft:+v.rentMonthsLeft||0,rentSetAside:+v.rentSetAside||0});});
  else if(act==="editday") form(t("sp.day"),[
    {k:"dayCapacity",label:t("f.freehours"),type:"number",step:"0.5",def:S.settings.dayCapacity,hint:t("f.freehoursH")},
    {k:"offDay",label:t("f.dayoff"),type:"select",options:t("daysFull").map(function(d,i){return [String(i),d];}),def:String(S.settings.offDay)}
  ],null,function(v){S.settings.dayCapacity=+v.dayCapacity||0;S.settings.offDay=+v.offDay;});
  else if(act==="editco") form(t("sp.co"),[
    {k:"company",label:t("f.coname"),def:S.settings.company},
    {k:"currency",label:t("f.curr"),def:S.settings.currency}
  ],null,function(v){S.settings.company=v.company;S.settings.currency=v.currency||"$";});
  else if(act==="editpins") form(t("sp.pins"),[
    {k:"owner",label:t("f.pinowner"),def:S.settings.pins.owner,hint:t("f.pinH")},
    {k:"manager",label:t("f.pinmgr"),def:S.settings.pins.manager},
    {k:"accountant",label:t("f.pinacc"),def:S.settings.pins.accountant}
  ],null,function(v){S.settings.pins={owner:v.owner,manager:v.manager,accountant:v.accountant};});
  else if(act==="export"){
    var b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    var u=URL.createObjectURL(b),l=document.createElement("a");
    l.href=u;l.download="studio-ledger-"+todayISO()+".json";l.click();URL.revokeObjectURL(u);}
  else if(act==="import"){
    var q=document.createElement("input");q.type="file";q.accept="application/json";
    q.onchange=function(){var rd=new FileReader();rd.onload=function(){
      try{S=JSON.parse(rd.result);save();render();}catch(e){alert(t("badFile"));}};rd.readAsText(q.files[0]);};
    q.click();}
  else if(act==="reset"){if(confirm(t("confirmReset"))){S=seed();save();render();}}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")el("modalHost").innerHTML="";});

/* ═════════════ boot ═════════════ */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
Store.load().then(async function(d){
  if(d&&d.settings){S=d;
    if(!S.settings.pins)S.settings.pins={owner:"",manager:"",accountant:""};
    if(!S.payments)S.payments=[];
    if(!S.advances)S.advances=[];
    if(!S.settings.theme)S.settings.theme="dark";
    if(!S.settings.accent)S.settings.accent="#9DA79F";
    if(S.settings.logo==null)S.settings.logo=LOGO;
    S.customers.forEach(function(c){
      if(c.openingDue==null)c.openingDue=0;
      if(!c.startMonth)c.startMonth=ymNow();
      if(c.endMonth==null)c.endMonth="";});
  }
  LANG=S.settings.lang||"ar";
  applyTheme();
  var went=false;
  try{ went=await bootCloud(); }catch(e){ went=false; }
  if(!went){ MODE="local"; renderGate(); }
});
})();
</script>
